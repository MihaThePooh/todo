<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7f6f4">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Дела">
<title>Дела</title>
<style>
:root {
  --bg: #f7f6f4;
  --card: #ffffff;
  --fg: #1a1714;
  --muted: #8b837a;
  --line: #e3ded7;
  --accent: #2f6f4e;
  /* Высота одной строки текста дела: 16px × 1.45. По ней выравниваем
     всё, что стоит в строке рядом с текстом. */
  --rowh: 23.2px;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

/* Интерфейс — не текст документа: выделять в нём нечего. Долгий тап
   по делу больше не поднимает синюю подсветку и меню «копировать».
   Поля ввода из запрета исключены, иначе в них нельзя было бы
   ни выделить, ни поправить набранное. */
body {
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
}
textarea, input {
  -webkit-user-select: text;
  user-select: text;
  -webkit-touch-callout: default;
}

/* Смахнутая карточка уходит левее своего места в списке, за край
   экрана. Обрезать её должен экран, поэтому клип живёт здесь, а не
   на карточке. Именно clip, а не hidden: hidden сделал бы body
   прокручиваемым блоком и залипающая шапка перестала бы липнуть. */
html, body { overflow-x: clip; }

body {
  margin: 0;
  /* Отступ снизу был заложен под форму добавления. Формы больше нет. */
  padding: 0 0 calc(18px + env(safe-area-inset-bottom));
  background: var(--bg);
  color: var(--fg);
  font: 16px/1.45 -apple-system, "Segoe UI", Roboto, sans-serif;
}

header {
  position: sticky;
  top: 0;
  z-index: 20;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: calc(5px + env(safe-area-inset-top)) 14px 5px;
  background: var(--bg);
  border-bottom: 1px solid var(--line);
}

/* Шапка набрана так же, как заголовки разделов: капслок, тот же размер,
   тот же приглушённый цвет. Она подпись, а не заголовок страницы. */
h1 {
  margin: 0;
  font-size: 16px;
  font-weight: 400;
  letter-spacing: .09em;
  text-transform: uppercase;
  color: var(--muted);
}

/* Бургер той же формы, что «+» и карандаш в заголовках разделов. */
#burger {
  width: 24px;
  height: 24px;
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 1.6px solid #c3bcb2;
  border-radius: 5px;
  background: none;
  color: var(--muted);
  padding: 0;
  cursor: pointer;
}
#burger svg { width: 13px; height: 13px; display: block; }
#burger:active { transform: scale(.92); }

/* Меню: лист выезжает из-под шапки, остальное гаснет. */
#menu {
  position: fixed;
  inset: 0;
  z-index: 60;
  background: rgba(16, 13, 11, .45);
  animation: fade .18s ease;
}
#menu.out { animation: fade .16s ease reverse forwards; }
#menu .sheet {
  position: absolute;
  left: 10px;
  right: 10px;
  top: calc(44px + env(safe-area-inset-top));
  max-height: 76vh;
  overflow: auto;
  padding: 6px;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 13px;
  box-shadow: 0 12px 34px rgba(0, 0, 0, .16);
  animation: riseIn .2s cubic-bezier(.2, .8, .2, 1);
}
#menu .row {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  padding: 12px 11px;
  border: 0;
  border-radius: 9px;
  background: none;
  color: var(--fg);
  font: inherit;
  text-align: left;
  cursor: pointer;
}
#menu .row:active { background: #f1eee9; }
#menu .row svg { width: 18px; height: 18px; flex: 0 0 auto; color: var(--muted); }

/* Раскрывающаяся часть пункта — та же механика, что у архива.
   Высоту здесь НЕ задаём: fold() ставит её сам и в конце снимает,
   а постоянное height:0 схлопнуло бы блок сразу после раскрытия. */
#menu .body { overflow: hidden; transition: height .24s cubic-bezier(.2,.8,.2,1); }
#menu .inner { padding: 2px 11px 12px; }
#menu p {
  margin: 0 0 9px;
  font-size: 13px;
  line-height: 1.5;
  color: var(--muted);
}
#menu .link {
  padding: 9px 10px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--bg);
  font: 12px/1.45 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  color: var(--fg);
  word-break: break-all;
  -webkit-user-select: text;
  user-select: text;
}
/* Перестановка разделов. Класс mgrip, а не grip: у полоски на карточке
   дела свои отрицательные отступы под её раскладку, здесь они бы всё
   перекосили. Вид тот же, правила свои. */
#menu .mover { display: flex; flex-direction: column; gap: 6px; margin: 2px 0 2px; }
#menu .mrow {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 10px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--card);
  font-size: 14px;
  touch-action: none;   /* иначе телефон скроллит вместо перетаскивания */
}
/* Крупнее самой полоски: за неё цепляются пальцем, а не мышью.
   Отступы дают площадь нажатия, отрицательные поля съедают её обратно
   в раскладке — строка от этого почти не растёт. */
#menu .mgrip {
  flex: 0 0 auto;
  color: #c3bcb2;
  font-size: 24px;
  line-height: 1;
  padding: 10px 13px;
  margin: -8px -8px -8px -6px;
  cursor: grab;
  user-select: none;
  touch-action: none;
}
#menu .mname { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
/* Строка, которую держат: приподнята и обведена, чтобы взгляд её не терял. */
#menu .mrow.lift {
  border-color: var(--accent);
  box-shadow: 0 6px 16px rgba(0, 0, 0, .16);
}

#menu .acts { display: flex; gap: 8px; margin-top: 9px; }
#menu .acts button {
  flex: 1 1 0;
  padding: 10px 8px;
  border: 0;
  border-radius: 8px;
  background: var(--accent);
  color: #fff;
  font: inherit;
  font-size: 14px;
  cursor: pointer;
}
/* Класс намеренно свой: .ghost в этом файле — карточка, которую тащат
   пальцем, у неё position:fixed. Кнопка с тем же именем выпадала из
   строки и наезжала на соседнюю. */
#menu .acts .plain {
  background: none;
  border: 1px solid var(--line);
  color: var(--fg);
}
/* Кнопки панели перестановки — свой класс, не общий .acts: у панели
   «перенести на другое устройство» кнопки со словами, им ширина нужна,
   а здесь две короткие и растягивать их не на что. Роли и цвета те же,
   что у «ок» и «×» при правке дела, чтобы не заводить третий язык. */
#menu .macts {
  display: flex;
  justify-content: flex-end;
  gap: 8px;
  margin-top: 10px;
}
#menu .macts button {
  flex: 0 0 auto;
  min-width: 56px;
  height: 44px;
  padding: 0 16px;
  border: 0;
  border-radius: 8px;
  background: var(--accent);
  color: #fff;
  font: inherit;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
}
#menu .macts .mno { background: #c0392b; font-size: 17px; }
#menu .macts button:active { transform: scale(.97); }
#menu .acts button:active { transform: scale(.97); }
#menu .warn { color: #a8452f; }

/* Приветствие для того, кто пришёл по голой ссылке. Приложение за ним
   видно целиком, только пустое, — сразу понятно, что получишь. */
#hello {
  position: fixed;
  inset: 0;
  z-index: 70;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0 18px;
  background: rgba(16, 13, 11, .45);
  animation: fade .2s ease;
}
/* Класс намеренно свой: .box в этом файле — чекбокс дела, 21x21,
   и карточка приветствия унаследовала бы его размеры. */
#hello .sheet {
  width: 100%;
  max-width: 330px;
  padding: 18px 18px 16px;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 14px;
  box-shadow: 0 12px 34px rgba(0, 0, 0, .18);
  animation: riseIn .22s cubic-bezier(.2, .8, .2, 1);
}
#hello b { display: block; margin-bottom: 8px; font-size: 17px; font-weight: 600; }
#hello p { margin: 0 0 14px; font-size: 14px; line-height: 1.5; color: var(--muted); }
/* Отступ держим на кнопке, а не на абзаце: у абзаца стоит класс last
   с нулевым нижним полем — он нужен, когда текст подменяется прощальным
   сообщением и кнопки под ним уже нет. */
#hello .go {
  width: 100%;
  margin-top: 16px;
  padding: 12px;
  border: 0;
  border-radius: 9px;
  background: var(--accent);
  color: #fff;
  font: inherit;
  font-size: 15px;
  cursor: pointer;
}
#hello .go:active { transform: scale(.98); }
/* Приветствие не пропадает рывком: сначала гаснет текст с кнопкой,
   на их месте появляется сообщение, и только потом уходит вся
   подложка. Высоту карточки ведём отдельно — иначе она скачет
   в момент подмены текста. */
#hello .inner { transition: opacity .45s ease; }
#hello .inner.gone { opacity: 0; }
#hello .sheet { transition: height .3s cubic-bezier(.2, .8, .2, 1); }
#hello .last { margin-bottom: 0; }
#hello.out { opacity: 0; transition: opacity .4s ease; }

/* Показ приёмов. Экран НЕ гасим: приложение должно быть видно как
   есть. Слой поверх нужен только чтобы случайный тап не сбил показ. */
#tour {
  position: fixed;
  inset: 0;
  z-index: 60;
  background: none;
}
#tour.out { opacity: 0; transition: opacity .3s ease; }
/* «Пропустить» лежит в body, а не внутри #tour: у того свой z-index,
   он образует слой, и кнопка не смогла бы подняться над окном вопроса —
   а прервать показ надо в любой момент, в том числе когда оно открыто. */
.tourskip {
  position: fixed;
  z-index: 90;
  left: 50%;
  transform: translateX(-50%);
  bottom: calc(24px + env(safe-area-inset-bottom));
  padding: 9px 18px;
  border: 1px solid var(--line);
  border-radius: 9px;
  background: var(--card);
  color: var(--muted);
  font: inherit;
  font-size: 13px;
  box-shadow: 0 4px 14px rgba(0, 0, 0, .12);
  cursor: pointer;
}

/* Подпись стоит вплотную к тому, о чём говорит, а не внизу экрана:
   иначе взгляд мечется между текстом и местом действия.
   Лежит в body, а не внутри #tour: тот со своим z-index образует
   отдельный слой, из которого не подняться выше. */
.near {
  position: absolute;
  /* Выше окна вопроса (80): показ подводит и к нему тоже, а подсказка,
     оказавшаяся под окном, была бы не видна. */
  z-index: 82;
  max-width: 250px;
  padding: 9px 12px;
  background: var(--accent);
  border: 0;
  border-radius: 11px;
  box-shadow: 0 10px 26px rgba(0, 0, 0, .28);
  font-size: 14px;
  line-height: 1.4;
  font-weight: 500;
  color: #fff;
  animation: riseIn .3s cubic-bezier(.2, .8, .2, 1);
}

/* Круг на месте касания: вдвое больше самой кнопки и прозрачный,
   чтобы сквозь него было видно, по чему именно нажали. */
.tapdot {
  position: absolute;
  z-index: 81;   /* см. .near: круг тоже должен ложиться поверх окна */
  border: 3px solid rgba(47, 111, 78, .95);
  border-radius: 50%;
  background: rgba(47, 111, 78, .3);
  box-shadow: 0 0 0 2px rgba(255, 255, 255, .5);
  pointer-events: none;
  animation: tapgrow 1s ease-out forwards;
}
@keyframes tapgrow {
  from { transform: scale(.3); opacity: 0; }
  20%  { opacity: 1; }
  60%  { opacity: 1; }
  to   { transform: scale(1); opacity: 0; }
}
/* Жест — не точка: круг едет вместе с «пальцем» и гаснет в конце,
   поэтому у него не разрастание, а обычный переезд. */
.tapdot.hold { animation: none; opacity: 1; transition: opacity .3s ease; }
.tapdot.hold.gone { opacity: 0; }

#state {
  margin-left: auto;
  font-size: 12px;
  color: var(--muted);
  white-space: nowrap;
}
#state.err { color: #b03030; font-weight: 600; }

section { margin: 18px 12px 0; }
/* Под шапкой лишний воздух ни к чему — экран небольшой. */
section:first-of-type { margin-top: 11px; }

section > h2 {
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 0 0 8px 4px;
  font-size: 12px;
  font-weight: 400;
  letter-spacing: .09em;
  text-transform: uppercase;
  color: var(--muted);
}

/* Три рабочих раздела — крупнее прочих: в них попадают пальцем чаще
   всего. Текст +33%, кнопки +50%, зазор между ними шире. */
h2.main { font-size: 16px; margin-bottom: 10px; }
h2.main .tools { gap: 12px; }
h2.main .plus,
h2.main .pen,
h2.main .del,
h2.main .okmini,
h2.main .nomini {
  width: 32px;
  height: 32px;
  border-radius: 8px;
}
h2.main .plus { font-size: 22px; }
h2.main .pen svg,
h2.main .del svg { width: 18px; height: 18px; }
h2.main .okmini,
h2.main .nomini { min-width: 32px; font-size: 13px; padding: 0; }
h2.main .nomini { font-size: 17px; }

/* Правая группа кнопок заголовка. margin-left:auto отжимает её к краю:
   он совпадает с правым краем карточек, так ближе большому пальцу. */
.tools {
  margin-left: auto;
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  gap: 8px;
}

/* Кнопка «+» в заголовке — той же формы, что и чекбокс у дела. */
.plus {
  width: 21px;
  height: 21px;
  flex: 0 0 auto;
  border: 1.6px solid #c3bcb2;
  border-radius: 5px;
  background: none;
  color: var(--muted);
  font: 400 15px/1 -apple-system, "Segoe UI", Roboto, sans-serif;
  cursor: pointer;
  padding: 0;
}
.plus:active { transform: scale(.92); }

/* Карандаш — переименовать раздел. Квадрат той же формы, что «+». */
.pen {
  width: 21px;
  height: 21px;
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 1.6px solid #c3bcb2;
  border-radius: 5px;
  background: none;
  color: var(--muted);
  cursor: pointer;
  padding: 0;
}
.pen svg { width: 12px; height: 12px; display: block; }
.pen:active { transform: scale(.92); }

/* Удалить раздел. Нарочно теми же цветами, что карандаш: красной эта
   кнопка стояла бы в заголовке пятном и притягивала палец. Тормозит
   здесь не цвет, а вопрос с отсчётом. */
.del {
  width: 21px;
  height: 21px;
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 1.6px solid #c3bcb2;
  border-radius: 5px;
  background: none;
  color: var(--muted);
  cursor: pointer;
  padding: 0;
}
.del svg { width: 12px; height: 12px; display: block; }
.del:active { transform: scale(.92); }
/* Последний оставшийся раздел удалить нельзя: класть дела станет некуда. */
/* hidden сам по себе бессилен: у кнопок задан display, и он его
   перебивает. На время переименования обе кнопки уходят, а их места
   занимают «отмена» и «ок» — ряд остаётся из трёх, ничего не прыгает. */
.del[hidden], .pen[hidden] { display: none; }

/* «ок» при переименовании раздела. Ростом и формой — как карандаш
   рядом, цветом — как «ок» у дела. */
.okmini, .nomini {
  height: 21px;
  min-width: 21px;
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0 4px;
  border: 0;
  border-radius: 5px;
  background: var(--accent);
  color: #fff;
  font-weight: 600;
  font-size: 10px;
  cursor: pointer;
}
.okmini:active, .nomini:active { transform: scale(.92); }

/* Поле переименования занимает место заголовка и выглядит ровно как он:
   тот же шрифт, капс, разрядка и цвет, без рамки и подчёркивания. Что
   идёт правка, видно по выделению и мигающему курсору — этого хватает.
   Форме ничего не достаётся по наследству само: font, цвет и регистр
   браузер задаёт ей своими стилями, поэтому забираем их обратно явно. */
.tt input {
  width: 100%;
  border: 0;
  padding: 0;
  margin: 0;
  background: none;
  font: inherit;
  color: inherit;
  text-transform: inherit;
  letter-spacing: inherit;
  outline: none;
}

/* «отмена» рядом с «ок»: та же кнопка, только красная. */
.nomini {
  background: #c0392b;
  font-size: 13px;
}

/* Значок «i» — тонкий кружок, внутри пусто. */
.info {
  width: 19px;
  height: 19px;
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 1.4px solid #c3bcb2;
  border-radius: 50%;
  background: none;
  color: var(--muted);
  font: 600 11px/1 Georgia, "Times New Roman", serif;
  cursor: pointer;
  padding: 0;
}
.info:active { transform: scale(.9); }

/* Облачко-пояснение. Хвостик — квадрат, повёрнутый на 45°, поэтому
   выглядит треугольником, торчащим из верхнего края. */
/* Подложка накрывает всё, включая липкую шапку (у неё z-index 20):
   пока читаешь пояснение, остальное приглушено и не отвлекает.
   Заодно она перехватывает касания — страница под ней не прокрутится. */
#tip {
  position: fixed;
  inset: 0;
  z-index: 60;
  background: rgba(16, 13, 11, .45);
  animation: fade .18s ease;
}
#tip.out { animation: fade .16s ease reverse forwards; }

@keyframes fade { from { opacity: 0; } to { opacity: 1; } }

#tip .bubble {
  position: absolute;
  left: 12px;
  right: 12px;
  z-index: 1;
  max-height: 72vh;
  overflow: auto;
  padding: 13px 15px;
  background: #fff;
  border: 1px solid var(--line);
  border-radius: 13px;
  box-shadow: 0 12px 34px rgba(0,0,0,.16);
  animation: riseIn .2s cubic-bezier(.2,.8,.2,1);
}

/* Смысловой блок заголовка: название вместе со своей кнопкой «i».
   В строке архива таких блока два — архив и корзина, — и подсвечивается
   только тот, про который спросили. */
.grp {
  display: flex;
  align-items: center;
  gap: 10px;
  min-width: 0;
}

/* На время пояснения блок поднимается НАД затемнением и обводится
   такой же рамкой, как окошко. Рамка через outline, а не border:
   outline не занимает места в потоке, поэтому заголовок не растёт
   и соседние блоки не съезжают. outline-offset даёт зазор, а тень
   того же цвета, что фон, этот зазор заливает — иначе в нём
   просвечивало бы затемнение. */
.grp.spot {
  position: relative;
  z-index: 61;
  pointer-events: none;   /* тап по подсвеченному блоку закрывает пояснение */
  border-radius: 12px;
  outline: 1px solid var(--line);
  outline-offset: 7px;
  background: var(--bg);
  box-shadow: 0 0 0 7px var(--bg);
}
#tip b {
  display: block;
  margin-bottom: 5px;
  font-size: 12px;
  font-weight: 500;
  letter-spacing: .09em;
  text-transform: uppercase;
  color: var(--muted);
}
#tip p {
  margin: 0;
  font-size: 14px;
  line-height: 1.5;
  white-space: pre-line;   /* переносы в тексте — как написаны */
}

#arcHead { cursor: pointer; user-select: none; }
#arcHead .caret { transition: transform .18s ease; }
#arcHead.open .caret { transform: rotate(90deg); }

.list { min-height: 14px; }

/* .item — только обойма: обрезает то, что выехало за край, и держит
   под собой кнопку удаления. Сама карточка — .card внутри. Такое
   разделение нужно, чтобы вбок уезжала карточка ЦЕЛИКОМ, вместе
   с рамкой, а не одно её содержимое. */
.item {
  position: relative;
  margin-bottom: 6px;
  touch-action: pan-y;   /* вертикальная прокрутка остаётся браузеру,
                            горизонтальные движения приходят нам */
}

/* Видимая карточка. position+z-index обязательны: без них абсолютная
   кнопка удаления рисуется ПОВЕРХ карточки и видна всегда. */
.card {
  position: relative;
  z-index: 1;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 10px;
  transition: transform .22s cubic-bezier(.2,.8,.2,1);
}
.item.swiping .card { transition: none; }

/* will-change поднимает слой на отдельную растеризацию, и на дробном
   масштабе экрана его край не совпадает с краем родителя. Держим его
   ТОЛЬКО пока палец ведёт: в состоянии «открыто» карточка уже стоит,
   ускорять нечего. */
.item.swiping .card { will-change: transform; }

.face {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 11px 12px;
}

/* Выделенное дело. Кольцо рисуется псевдоэлементом, а не рамкой: оно
   лежит поверх карточки и НЕ занимает места, поэтому список не
   дёргается в момент включения.

   Как получается именно кольцо: элемент растянут на 2px наружу от
   карточки, залит градиентом и закрыт маской из двух слоёв —
   всё поле и только его внутренняя часть. Режим exclude вычитает
   второй из первого, остаётся полоса в 3px по краю: два пикселя
   снаружи, один внутри.

   Градиент втрое шире элемента и едет вбок — отсюда перелив. */
.item.star .card { border-color: transparent; }

.item.star .card::before {
  content: "";
  position: absolute;
  inset: -2px;
  border-radius: 12px;
  padding: 3px;
  pointer-events: none;
  background: linear-gradient(90deg,
    #2f6f4e, #17a07a, #4aa3e0, #7b5bd6, #d1477a, #e0952a, #2f6f4e);
  background-size: 300% 100%;
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite: xor;
  mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  mask-composite: exclude;
  animation: ringflow 6s linear infinite;
}

/* Разгорание — только в момент нажатия на звезду: класс вешает
   обработчик и снимает через полсекунды.
   Держать ringin в правиле выше было нельзя: разметка пересобирается
   на каждую перерисовку, а при загрузке страница рисуется дважды —
   сперва из памяти браузера, потом по ответу сервера. Кольцо честно
   зажигалось заново, и со стороны это выглядело как мигание. */
.item.star.fresh .card::before {
  animation: ringflow 6s linear infinite, ringin .5s ease both;
}

/* Разгорается: тонкое и бледное превращается в толстое и яркое. */
@keyframes ringin {
  from { opacity: 0; padding: 1px; inset: 0px; }
  to   { opacity: 1; padding: 3px; inset: -2px; }
}
@keyframes ringflow { to { background-position: -300% 0; } }

/* В архиве и корзине карточек как таковых нет — кольцу не за что
   зацепиться, оно только мешало бы читать список. */
#archive .item.star .card::before,
#bin .item.star .card::before { display: none; }

/* Две кнопки под карточкой: звезда ближе к тексту, удаление с краю —
   опасное действие дальше от пальца. 6 + 64 + 6 + 64 = 140, ровно на
   столько уезжает карточка. */
.trash, .fav {
  position: absolute;
  top: 0; bottom: 0;
  width: 64px;
  border: 0;
  border-radius: 10px;
  padding: 0;
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  visibility: hidden;   /* пока не смахнули — их нет совсем */
}
.trash { right: 0; background: #c0392b; }
.fav { right: 70px; background: #c8951b; }
.item.swiping .trash, .item.open .trash,
.item.swiping .fav, .item.open .fav { visibility: visible; }

/* Звезда пустая: виден только контур. При нажатии заливается и слегка
   подрастает — подтверждение до того, как карточка уедет обратно. */
.fav svg path {
  fill: currentColor;
  fill-opacity: 0;
  transition: fill-opacity .28s ease;
}
.fav svg { transition: transform .28s cubic-bezier(.2,.8,.2,1); }
.fav.lit svg path { fill-opacity: 1; }
.fav.lit svg { transform: scale(1.16); }

/* Подложка под карточкой прозрачная — сквозь щель на дробном масштабе
   виден фон страницы, а не красное. Красное лежит только справа, ровно
   там, где карточка уже уехала. */

.trash svg { width: 23px; height: 23px; display: block; }

/* Сама перетаскиваемая копия, летит за пальцем. */
.ghost {
  position: fixed;
  z-index: 100;
  pointer-events: none;
  /* Радиус тот же, что у карточки внутри. Без него тень рисуется от
     квадрата, и на скруглениях остаются светлые уголки: туда тень уже
     не заходит, а карточка ещё не дошла. */
  border-radius: 10px;
  box-shadow: 0 10px 30px rgba(0,0,0,.20);
  opacity: .97;
  margin: 0;
  transform: scale(1.02);
  transition: transform .14s ease, box-shadow .14s ease;
}
/* Ghost «приземляется»: тень и увеличение уходят, пока он летит в гнездо. */
.ghost.landing { transform: scale(1); box-shadow: 0 2px 8px rgba(0,0,0,.10); }

/* Не полоска, а пустое гнездо в рост карточки: видно, куда именно она
   встанет, и есть куда прилететь. */
.drop {
  border: 1.5px dashed #cec7bd;
  border-radius: 10px;
  background: rgba(0,0,0,.018);
  margin-bottom: 6px;
  box-sizing: border-box;
  transition: height .16s ease;
}

/* Всё, что стоит в строке рядом с текстом, ровно в одну строку высотой
   и центрирует своё содержимое. Тогда оптические центры совпадают
   с центром ПЕРВОЙ строки текста, а не с серединой карточки: у дела
   в три строки ручка и чекбокс остаются наверху, рядом с началом. */
.grip {
  flex: 0 0 auto;
  width: 26px;
  height: var(--rowh);
  /* Отрицательный отступ справа съедает пустоту внутри кнопки: значок
     узкий, кнопка широкая (в неё надо попадать пальцем), и без этого
     до чекбокса выходило вдвое больше, чем от чекбокса до текста.
     Область нажатия при этом остаётся прежней. */
  margin: 0 -9px 0 -4px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #c3bcb2;
  cursor: grab;
  touch-action: none;   /* иначе телефон начнёт скроллить вместо перетаскивания */
  user-select: none;
  font-size: 15px;
}

.box {
  flex: 0 0 auto;
  width: 21px;
  height: 21px;
  /* квадрат остаётся квадратом, поэтому центрируем его отступом */
  margin-top: calc((var(--rowh) - 21px) / 2);
  border: 1.6px solid #c3bcb2;
  border-radius: 5px;
  background: none;
  cursor: pointer;
  padding: 0;
}
.box:active { transform: scale(.92); }

/* Момент отметки: рамка заливается, галочка проявляется, квадратик
   коротко подпрыгивает — и только после этого дело уезжает в «сделано». */
.box.ticked {
  border-color: var(--accent);
  background: var(--accent);
  color: #fff;
  font-size: 14px;
  line-height: 1;
  animation: tick .3s cubic-bezier(.2,.8,.2,1);
}
@keyframes tick {
  0%   { transform: scale(1);    }
  40%  { transform: scale(1.22); }
  100% { transform: scale(1);    }
}
.box.ticked:active { transform: none; }

/* Галочка у сделанного дела — метка, а не кнопка: не нажимается
   и не приседает под пальцем. */
.box.mark {
  border: 0;
  color: var(--accent);
  cursor: default;
  opacity: 1;
}
.box.mark:active { transform: none; }

.txt {
  flex: 1 1 auto;
  min-width: 0;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}
.txt a { color: var(--accent); }

.txt textarea {
  display: block;   /* по умолчанию inline-block: садится на базовую линию
                       и оставляет под собой пустую полосу — от неё карточка
                       и подрастала при открытии правки */
  width: 100%;
  border: 0;
  padding: 0;
  margin: 0;
  font: inherit;
  line-height: inherit;
  color: inherit;
  background: none;
  resize: none;
  outline: none;
  overflow: hidden;
  vertical-align: top;
}

.kill {
  flex: 0 0 auto;
  height: var(--rowh);
  display: flex;
  align-items: center;
  border: 0;
  background: none;
  color: #cdc6bd;
  font-size: 19px;
  line-height: 1;
  padding: 0 2px 0 6px;
  cursor: pointer;
}

#done .card { border-color: #e8e3db; background: #f2f0ec; }
#done .txt { color: var(--muted); text-decoration: line-through; }

.empty { padding: 4px 6px 10px; color: #b8b0a6; font-size: 14px; }

/* Заглушки на время первой загрузки. Занимают ровно столько же места,
   сколько займут настоящие карточки, — поэтому список не схлопывается
   и не прыгает, когда данные приходят. */
.item.skel { pointer-events: none; }

.sk {
  display: block;
  position: relative;
  overflow: hidden;
  border-radius: 6px;
  background: #ece8e3;
}
.sk-grip { flex: 0 0 auto; width: 14px; height: 14px; margin-top: 5px; }
.sk-box  { flex: 0 0 auto; width: 21px; height: 21px; margin-top: 1px; border-radius: 5px; }
.sk-line { height: 12px; margin-top: 6px; }

/* Блик пробегает слева направо — видно, что идёт работа, а не зависло. */
.sk::after {
  content: "";
  position: absolute;
  inset: 0;
  transform: translateX(-100%);
  background: linear-gradient(90deg, transparent, rgba(255,255,255,.8), transparent);
  animation: shimmer 1.3s infinite;
}
@keyframes shimmer { to { transform: translateX(100%); } }

/* Кнопки «ок» и «×».
   Высота задана жёстко и равна одной строке текста (16px × 1.45 = 23px):
   кнопка вписывается в строку дела и не разгоняет карточку по высоте.
   Отступы только по бокам — вертикальные снова добавили бы высоту. */
.ok, .nope {
  flex: 0 0 auto;
  height: var(--rowh);
  display: flex;
  align-items: center;
  justify-content: center;
  border: 0;
  border-radius: 7px;
  color: #fff;
  font-weight: 600;
  cursor: pointer;
  margin: 0;
}

.ok {
  background: var(--accent);
  font-size: 13px;
  padding: 0 12px;
}

.nope {
  background: #c0392b;
  font-size: 15px;
  padding: 0 10px;
}

#archive .item, #bin .item { margin: 0; }
#archive .card, #bin .card { background: none; border: 0; border-radius: 0; }
#archive .face, #bin .face { padding: 7px 12px; }
#archive .txt, #bin .txt { color: var(--muted); font-size: 15px; }
/* Тут строка короче: шрифт 15px × 1.45. Переопределяем — и выравнивание
   по первой строке пересчитывается само, формулы менять не нужно. */
#archive .item, #bin .item { --rowh: 21.75px; }
#archive .when, #bin .when {
  flex: 0 0 auto;
  height: var(--rowh);
  display: flex;
  align-items: center;
  color: #bdb5ab;
  font-size: 12px;
}

/* Корзина: значок в правом углу той же строки, где заголовок архива. */
#arcHead { display: flex; align-items: center; gap: 10px; }
/* Тире и число — отдельные ячейки того же ряда, поэтому расстояние
   между «Архив», тире и числом задаёт один и тот же gap. Обычный пробел
   внутри строки дал бы другую, шрифтовую ширину. */
#arcCnt { display: flex; align-items: center; gap: 10px; }

.binbtn {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  gap: 5px;
  border: 0;
  padding: 2px 0 2px 12px;
  background: none;
  color: var(--muted);
  font: inherit;
  font-size: 12px;
  letter-spacing: .02em;
  cursor: pointer;
}
.binbtn svg { width: 17px; height: 17px; display: block; }
.binbtn:active { transform: scale(.92); }
.binbtn.on { color: #b03030; }

/* Кнопка возврата дела из корзины. */
.undo {
  flex: 0 0 auto;
  height: var(--rowh);
  display: flex;
  align-items: center;
  border: 0;
  background: none;
  color: var(--accent);
  font-size: 18px;
  line-height: 1;
  padding: 0 2px 0 8px;
  cursor: pointer;
}

/* --- движение ---------------------------------------------------- */

/* Новая карточка не возникает, а проявляется сверху вниз. Класс вешается
   ровно на одну строку — ту, которая только что появилась. */
@keyframes riseIn {
  from { opacity: 0; transform: translateY(-8px) scale(.985); }
  to   { opacity: 1; transform: none; }
}
.item.in { animation: riseIn .26s cubic-bezier(.2,.8,.2,1); }

/* Свой раздел проявляется в момент создания. Класс висит меньше
   секунды и снимается: держать анимацию в постоянном правиле нельзя —
   разметка разделов пересобирается, и она играла бы каждый раз. */
section[data-sec].born { animation: riseIn .42s cubic-bezier(.2,.8,.2,1); }

/* Раздел, уехавший в корзину. Отличается от дела намеренно резко:
   зелёная грань по левому краю, значок стопки, имя жирным и подпись
   со счётом дел внутри. Дело — строка текста, раздел — карточка. */
#bin .item.sec .card {
  border-left: 3px solid var(--accent);
  background: #fbfaf7;
}
#bin .item.sec .txt { color: var(--fg); }
/* Всё в одну строку: имя, точка, счёт. Имя жирным — по нему и читается,
   что это раздел, а не дело. */
#bin .item.sec .txt b { font-weight: 600; font-size: 15px; }
#bin .item.sec .sub { color: var(--muted); letter-spacing: .02em; }
.secicon {
  flex: 0 0 auto;
  height: var(--rowh);
  display: flex;
  align-items: center;
  color: var(--accent);
}
.secicon svg { width: 16px; height: 16px; display: block; }

/* --- вопрос перед удалением раздела --- */

#ask {
  position: fixed;
  inset: 0;
  z-index: 80;
  display: flex;
  align-items: center;
  justify-content: center;
  /* Отступы у окна скромные: ширины должно хватить, чтобы «Да, удалить»
     со счётчиком уместилось в одну строку даже на узком телефоне. */
  padding: 12px;
  background: rgba(20, 17, 15, .34);
  opacity: 0;
  transition: opacity .18s ease;
}
#ask.shown { opacity: 1; }

/* Имя askbox, а не box: .box в этом файле уже занят — это квадратик
   чекбокса у дела, 21×21. Окно наследовало от него высоту и схлопывалось
   в полоску, а текст и кнопки вываливались наружу. */
#ask .askbox {
  width: 100%;
  max-width: 340px;
  padding: 16px 16px 14px;
  border-radius: 14px;
  background: var(--card);
  box-shadow: 0 18px 44px rgba(0, 0, 0, .26);
  animation: riseIn .24s cubic-bezier(.2,.8,.2,1);
}
#ask b { display: block; font-size: 16px; font-weight: 600; margin-bottom: 7px; }
#ask p { margin: 0 0 16px; font-size: 14px; line-height: 1.45; color: var(--muted); }
#ask .acts { display: flex; gap: 6px; }

#ask .acts button {
  /* auto, а не 0: при равной ширине «Да, удалить» со счётчиком не
     помещалось в строку и переносилось. Теперь кнопка берёт столько,
     сколько нужно её надписи, а остаток делится поровну. nowrap —
     страховка: перенос запрещён совсем. */
  flex: 1 1 auto;
  white-space: nowrap;
  padding: 11px 6px;
  border: 0;
  border-radius: 10px;
  font: inherit;
  font-size: 13.5px;
  color: #fff;
  cursor: pointer;
}

/* Пока идёт отсчёт — кнопка тусклая и не нажимается. Загорается сама. */
#ask .yes { background: #b23b2e; opacity: .4; transition: opacity .45s ease; }
#ask .yes:not([disabled]) { opacity: 1; }
#ask .yes[disabled] { cursor: default; }
#ask .no { background: var(--accent); }
#ask .acts button:not([disabled]):active { transform: scale(.97); }

/* Счётчик и его пустой близнец справа одинаковой ширины: надпись
   стоит ровно посередине кнопки, и цифра, пропадая, ничего не сдвигает. */
#ask .yes { display: flex; align-items: center; justify-content: center; gap: 5px; }
#ask .cd { flex: 0 0 auto; min-width: 1.45em; text-align: center; }

/* Нажатия. Кнопка, которая не отвечает на палец, и делает интерфейс
   «деревянным» — отклик важнее самой анимации. */
.ok, .nope, .undo, .kill, .binbtn, .trash, .okmini, .nomini, .pen, .info { transition: transform .1s ease, opacity .1s ease; }
.ok:active, .nope:active, .undo:active, .kill:active { transform: scale(.94); }
.trash:active { opacity: .82; }

/* Сворачивающиеся полки считают высоту в JS — здесь только сглаживание. */
#archive, #bin { transition: height .24s cubic-bezier(.2,.8,.2,1); }

/* Кому анимации мешают (настройка телефона) — тем ничего не двигается. */
@media (prefers-reduced-motion: reduce) {
  * { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}

@media (min-width: 720px) {
  body { max-width: 760px; margin: 0 auto; }
  /* Меню — position:fixed, а такой элемент считает координаты от окна,
     а не от страницы, и про её max-width ничего не знает. На широком
     экране лист расползался во всю ширину окна. Возвращаем его в колонку
     приложения: 50% минус половина колонки (380) плюс её отступ (10). */
  #menu .sheet {
    left: calc(50% - 370px);
    right: auto;
    width: 400px;
  }
}
</style>
</head>
<body>

<header>
  <button id="burger" aria-label="меню">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
         stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
  </button>
  <h1>Дела</h1>
  <span id="state">…</span>
</header>

<section data-sec="deadline">

<script>
(function () {
  /* Разделы. Три встроенных плюс свои, заведённые из меню; порядок
     своих задаёт doc.extra, и он же — порядок на экране.
     LISTS и ALL поэтому не константы: после каждой замены документа их
     пересобирает relist(). Все перечисления разделов ходят через них —
     отрисовка, перетаскивание, подсчёт изменений, — так что новый
     раздел работает наравне со встроенными сам собой. */
  var BASE_LISTS = ['deadline', 'free', 'ideas'];
  var TAIL = ['done', 'archive', 'bin'];
  var EXTRA_RE = /^x[0-9a-f]{8}$/;   // та же форма, что проверяет сервер
  var MAX_EXTRA = 20;
  var LISTS = BASE_LISTS.slice();   // разделы, которые видно и куда можно класть
  var ALL = LISTS.concat(TAIL);     // всё, что рисуется на странице
  // Всё, что ХРАНИТСЯ. Отличается от ALL убранными встроенными разделами:
  // их поля из документа не исчезают, и в диффе их надо считать наравне
  // с остальными — иначе сервер оставит у себя дела, которые здесь уже
  // уехали в корзину, и вернёт их следующим ответом.
  var STORED = BASE_LISTS.concat(TAIL);
  var DAY = 24 * 60 * 60 * 1000;
  var WEEK = 7 * DAY;
  var YEAR = 365 * DAY;
  var KEY = 'todo.key', CACHE = 'todo.cache';

  /* --- ключ доступа: один раз из адреса, дальше из памяти браузера --- */
  var m = location.hash.match(/k=([a-f0-9]{64})/i);
  if (m) {
    localStorage.setItem(KEY, m[1]);
    history.replaceState(null, '', location.pathname);
  }
  /* Ссылку могут вставить во вкладку, где список уже открыт. Тогда
     меняется только часть после решётки, а это для браузера не переход:
     страница не перезагружается, разбор выше не отработает, и человек
     смотрит на прежний список, решив, что перенос не сработал.
     Ловим смену решётки отдельно и перезагружаемся сами. */
  window.addEventListener('hashchange', function () {
    var got = location.hash.match(/k=([a-f0-9]{64})/i);
    if (!got) { return; }
    try { localStorage.setItem(KEY, got[1].toLowerCase()); } catch (e) { /* приват */ }
    location.replace(location.pathname);
  });

  var key = localStorage.getItem(KEY);

  var doc = { updated: '', deadline: [], free: [], ideas: [], done: [], archive: [], bin: [] };
  // Идёт показ приёмов. Тогда поле ввода не забирает фокус: иначе
  // на телефоне вылезает клавиатура и закрывает половину экрана.
  var demo = false;
  var state = document.getElementById('state');
  var dirty = false, sending = false, timer = null;
  // synced — снимок того, что сейчас лежит на сервере. По разнице с ним
  // считаются изменения, и на сервер уезжают только они.
  var synced = null;
  // Версия протокола сервера. 0 — старый, понимает только документ
  // целиком. Пока не убедились в обратном, шлём по-старому: иначе
  // в момент обновления сервера изменения ушли бы в пустоту.
  var proto = 0;
  // Счётчик правок: если пока шёл запрос успели поправить ещё раз,
  // ответ не должен погасить флаг «есть несохранённое».
  var rev = 0, sentRev = 0;

  function say(text, bad) {
    state.textContent = text;
    state.className = bad ? 'err' : '';
  }

  function uid() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  }

  /* Пересобрать набор разделов по документу. Зовётся всюду, где doc
     заменяется целиком: из памяти браузера, из ответа сервера, после
     разрешения конфликта. Заодно чинит документ, пришедший кривым:
     раздел не той формы выбрасывается, пропавший список заводится
     пустым — иначе draw() споткнётся на первом же переборе. */
  function relist() {
    var own = [];
    (doc.extra || []).forEach(function (name) {
      if (EXTRA_RE.test(name) && own.indexOf(name) < 0) { own.push(name); }
    });
    own = own.slice(0, MAX_EXTRA);
    if (own.length) { doc.extra = own; } else { delete doc.extra; }

    // Убранные встроенные разделы. Ключ у встроенного не удалить —
    // на нём держится форма документа, — поэтому он просто помечен.
    var gone = [];
    (doc.off || []).forEach(function (name) {
      if (BASE_LISTS.indexOf(name) >= 0 && gone.indexOf(name) < 0) { gone.push(name); }
    });
    // Совсем без разделов остаться нельзя: класть дела будет некуда.
    if (gone.length >= BASE_LISTS.length && !own.length) { gone = gone.slice(0, -1); }
    if (gone.length) { doc.off = gone; } else { delete doc.off; }

    var live = BASE_LISTS.filter(function (n) { return gone.indexOf(n) < 0; }).concat(own);

    /* Порядок разделов на экране. Он живёт отдельно от набора: раздел
       может быть заведён, но ещё не переставлен, и наоборот — порядок
       может помнить раздел, который уже удалили. Поэтому берём из
       порядка только живое, а всё живое, чего в нём нет (только что
       заведённые разделы), дописываем в конец. */
    var seq = [];
    (doc.order || []).forEach(function (n) {
      if (live.indexOf(n) >= 0 && seq.indexOf(n) < 0) { seq.push(n); }
    });
    live.forEach(function (n) { if (seq.indexOf(n) < 0) { seq.push(n); } });
    // Поля не было — не заводим: пока разделы не переставляли, порядок
    // и так естественный, а лишнее поле гоняло бы дифф на пустом месте.
    if (doc.order) { doc.order = seq; }

    LISTS = seq;
    ALL = LISTS.concat(TAIL);
    STORED = BASE_LISTS.concat(own).concat(TAIL);
    STORED.forEach(function (name) { doc[name] = doc[name] || []; });
  }

  /* Открытое поле ввода. Пока оно на экране, перерисовывать список нельзя:
     draw() сносит разметку вместе с полем — клавиатура падает, а набранный
     текст пропадает, потому что дело в памяти ещё старое. Именно на этом
     правка и сбрасывалась через пару секунд, когда прилетал плановый опрос
     сервера. */
  function busy() {
    return !!document.querySelector('.item textarea, .tt input');
  }

  /* --- названия разделов ---
     Заголовки хозяин списка меняет сам, поэтому они не в разметке, а в
     документе: doc.names. Ключа нет — берём имя по умолчанию.
     Сервер хранит документ целиком, отдельного поля заводить не надо. */

  var TITLES = {
    deadline: 'С дедлайном',
    free: 'В свободное время',
    ideas: 'На подумать'
  };

  var NEW_TITLE = 'Новый раздел';

  function title(key) {
    // У своего раздела имени по умолчанию нет — он и рождается с этим.
    return (doc.names && doc.names[key]) || TITLES[key] || NEW_TITLE;
  }

  function renderTitles() {
    if (document.querySelector('.tt input')) { return; }   // идёт правка
    LISTS.forEach(function (key) {
      var host = document.getElementById('t-' + key);
      if (host) { host.textContent = title(key); }
    });
  }

  /* Разметка своих разделов. Встроенные лежат в странице, эти собираем
     сами — по одной секции на ключ, в порядке doc.extra, в самом низу
     страницы. Пересобираем только когда набор разделов правда сменился:
     иначе разметка обновлялась бы на каждую отрисовку. */
  var mounted = '';

  function mountSections() {
    var own = doc.extra || [];
    var gone = doc.off || [];
    // В отпечаток входит и порядок: переставили разделы — разметку надо
    // пересобрать, хотя набор остался прежним.
    var want = own.join('|') + '#' + gone.join('|') + '#' + LISTS.join('|');
    if (want === mounted) { return; }
    mounted = want;

    // Убранный встроенный раздел прячем и чистим: разметка его дел
    // осталась бы на странице невидимой, а по ней ищут строки.
    BASE_LISTS.forEach(function (key) {
      var s = document.querySelector('section[data-sec="' + key + '"]');
      if (!s) { return; }
      var off = gone.indexOf(key) >= 0;
      s.hidden = off;
      if (off) { document.getElementById(key).innerHTML = ''; }
    });

    // Свои разделы — единым блоком следом за встроенными и перед
    // «Сделано за сегодня»: все рабочие разделы идут подряд.
    [].forEach.call(document.querySelectorAll('section[data-sec^="x"]'),
      function (s) { s.remove(); });
    var anchor = document.getElementById('doneSec');
    own.forEach(function (key) {
      // key прошёл EXTRA_RE — это восемь шестнадцатеричных цифр,
      // в разметку такое подставлять безопасно.
      var s = document.createElement('section');
      s.dataset.sec = key;
      s.innerHTML =
        '<h2 class="main"><span class="tt" id="t-' + key + '"></span>' +
        '<span class="tools">' +
        '<button class="del" data-del="' + key + '" aria-label="удалить раздел"></button>' +
        '<button class="pen" data-ren="' + key + '" aria-label="переименовать раздел"></button>' +
        '<button class="plus" data-add="' + key + '" aria-label="добавить дело">+</button>' +
        '</span></h2><div class="list" id="' + key + '"></div>';
      document.body.insertBefore(s, anchor);
    });

    /* Расстановка. insertBefore не копирует, а переносит узел, поэтому
       достаточно пройти по порядку и каждый раздел подряд поставить
       перед «Сделано за сегодня» — они выстроятся как надо. Встроенные
       двигаются наравне со своими: человек волен поставить свой раздел
       первым. */
    LISTS.forEach(function (key) {
      var s = document.querySelector('section[data-sec="' + key + '"]');
      if (s) { document.body.insertBefore(s, anchor); }
    });

    // Значки рисуются кодом, а не лежат в разметке. Раньше их
    // расставляли один раз при загрузке — у разделов, созданных потом,
    // карандаш оставался пустым квадратом.
    paintIcons();

    // Последний раздел удалять не даём: дела станет некуда класть,
    // да и возвращать из корзины будет некуда.
    var only = LISTS.length <= 1;
    [].forEach.call(document.querySelectorAll('.del'), function (b) {
      b.hidden = only;
    });
  }

  /* Значки карандаша и корзины в заголовках разделов. */
  function paintIcons() {
    [].forEach.call(document.querySelectorAll('.pen'), function (b) {
      if (!b.firstChild) { b.innerHTML = PEN_SVG; }
    });
    [].forEach.call(document.querySelectorAll('.del'), function (b) {
      if (!b.firstChild) { b.innerHTML = TRASH_SVG; }
    });
  }

  /* Завести раздел. Ключ случайный: имя человек меняет карандашом,
     а ключ остаётся навсегда — по нему дела и находят свой раздел. */
  function newSectionKey() {
    var out;
    do {
      out = 'x';
      for (var i = 0; i < 8; i++) {
        out += '0123456789abcdef'[Math.floor(Math.random() * 16)];
      }
    } while (doc[out]);
    return out;
  }

  function addSection() {
    var own = (doc.extra || []).slice();
    if (own.length >= MAX_EXTRA) {
      say('больше ' + MAX_EXTRA + ' разделов не завести', true);
      return;
    }
    var key = newSectionKey();
    own.push(key);
    doc.extra = own;
    doc[key] = [];
    relist();
    queue();
    draw();
    var host = document.querySelector('section[data-sec="' + key + '"]');
    if (!host) { return; }
    // Появление показываем классом, а не постоянным правилом: разметка
    // пересобирается, и правило играло бы анимацию на каждой сборке.
    host.classList.add('born');
    setTimeout(function () { host.classList.remove('born'); }, 700);
    try { host.scrollIntoView({ behavior: 'smooth', block: 'center' }); }
    catch (e) { host.scrollIntoView(); }
  }

  /* --- удаление раздела ---
     Дела не пропадают: они уезжают в корзину тем же путём, что и
     удалённые поодиночке, и неделю их можно вернуть. Свой раздел
     исчезает совсем, встроенный помечается убранным — его ключ
     из документа не выкинуть, на нём держится форма. */

  function dropSection(key) {
    // Пока висел вопрос, раздел могли убрать с другого устройства.
    if (LISTS.indexOf(key) < 0) { return; }
    var when = Date.now();
    var rows = (doc[key] || []).map(function (task) {
      var copy = {};
      for (var f in task) { if (f !== 'draft') { copy[f] = task[f]; } }
      return copy;
    });
    // Раздел уезжает в корзину целиком, одной записью: с названием и
    // делами внутри. Так его и видно как раздел, и вернуть можно тем же
    // движением — со всем содержимым разом.
    doc.bin.unshift({
      id: uid(), sec: key, text: title(key), delAt: when, rows: rows
    });
    doc[key] = [];
    if (doc.names) { delete doc.names[key]; }
    if (EXTRA_RE.test(key)) {
      doc.extra = (doc.extra || []).filter(function (n) { return n !== key; });
      delete doc[key];
    } else {
      doc.off = (doc.off || []).concat([key]);
    }
    relist();
    purge();        // корзина заново сортируется по времени удаления
    queue();
    draw();
  }

  var ask = null;

  function shutAsk() {
    if (!ask) { return; }
    var box = ask;
    ask = null;
    clearInterval(box.timer);
    box.el.classList.remove('shown');
    setTimeout(function () { box.el.remove(); }, 200);
  }

  function askDelete(key) {
    if (ask || LISTS.indexOf(key) < 0 || LISTS.length <= 1) { return; }
    var count = (doc[key] || []).length;

    var el = document.createElement('div');
    el.id = 'ask';
    var box = document.createElement('div');
    box.className = 'askbox';
    el.appendChild(box);

    var head = document.createElement('b');
    head.textContent = 'Удалить раздел «' + title(key) + '»?';
    box.appendChild(head);

    var note = document.createElement('p');
    note.textContent = count
      ? ('Раздел уедет в корзину вместе с делами (' + count + '). ' +
         'Вернуть целиком можно 7 дней.')
      : 'Раздел пуст. Он уедет в корзину — вернуть можно 7 дней.';
    box.appendChild(note);

    var acts = document.createElement('div');
    acts.className = 'acts';
    box.appendChild(acts);

    var yes = document.createElement('button');
    yes.className = 'yes';
    yes.disabled = true;
    var cd = document.createElement('span');
    cd.className = 'cd';
    cd.textContent = '(5)';
    var lbl = document.createElement('span');
    lbl.textContent = 'Да, удалить';
    // Пустой близнец счётчика справа. Он держит надпись ровно по центру
    // кнопки — и пока цифра идёт, и когда она пропадает.
    var pad = document.createElement('span');
    pad.className = 'cd';
    pad.setAttribute('aria-hidden', 'true');
    yes.appendChild(cd);
    yes.appendChild(lbl);
    yes.appendChild(pad);
    yes.onclick = function () {
      if (yes.disabled) { return; }
      shutAsk();
      dropSection(key);
    };
    acts.appendChild(yes);

    var no = document.createElement('button');
    no.className = 'no';
    no.textContent = 'Нет, оставить';
    no.onclick = shutAsk;
    acts.appendChild(no);

    el.onclick = function (e) { if (e.target === el) { shutAsk(); } };
    document.body.appendChild(el);
    requestAnimationFrame(function () { el.classList.add('shown'); });

    // Пять секунд на подумать. Цифра уходит, но место под неё остаётся
    // занятым — иначе на последнем шаге надпись прыгнула бы влево.
    var left = 5;
    var timer = setInterval(function () {
      left--;
      if (left > 0) { cd.textContent = '(' + left + ')'; return; }
      clearInterval(timer);
      cd.style.visibility = 'hidden';
      yes.disabled = false;
    }, 1000);

    ask = { el: el, timer: timer };
  }

  function rename(key) {
    var host = document.getElementById('t-' + key);
    if (host.querySelector('input')) { return; }
    var was = title(key);
    var pen = document.querySelector('.pen[data-ren="' + key + '"]');

    var inp = document.createElement('input');
    inp.value = was;
    inp.maxLength = 40;
    host.textContent = '';
    host.appendChild(inp);
    if (!demo) { inp.focus(); }
    // Весь текст выделен сразу: чаще название заменяют целиком, а не
    // дописывают. select() на Android иногда молчит — дублируем явно.
    inp.select();
    try { inp.setSelectionRange(0, inp.value.length); } catch (e) { /* не поле — не беда */ }

    /* Кнопки правки встают НА МЕСТО корзины и карандаша, а не рядом
       с ними: корзина прячется под красную «отмену», карандаш — под
       зелёное «ок». Ряд как был из трёх кнопок, так и остаётся, ширина
       не меняется, и ничего не разъезжается. Порядок ролей тот же, что
       у черновика дела: слева «×», справа «ок». */
    var del = pen.parentNode.querySelector('.del');
    if (del) { del.hidden = true; }
    pen.hidden = true;

    var no = document.createElement('button');
    no.className = 'okmini nomini';
    no.textContent = '×';
    no.setAttribute('aria-label', 'отменить переименование');
    no.onpointerdown = function (e) { e.preventDefault(); afterButton(); finish(null); };
    pen.parentNode.insertBefore(no, del || pen);

    var ok = document.createElement('button');
    ok.className = 'okmini';
    ok.textContent = 'ок';
    ok.setAttribute('aria-label', 'сохранить название');
    // pointerdown + preventDefault: поле не теряет фокус, blur не мешает.
    // afterButton — чтобы догоняющий клик не попал в карандаш на месте,
    // которое освободится после исчезновения кнопки.
    ok.onpointerdown = function (e) { e.preventDefault(); afterButton(); finish(inp.value); };
    pen.parentNode.insertBefore(ok, pen);

    var closed = false;

    // v === null — уходим, ничего не меняя.
    function finish(v) {
      if (closed) { return; }
      closed = true;
      if (v !== null) {
        v = v.trim();
        doc.names = doc.names || {};
        // Вернул имя по умолчанию — не храним, пусть остаётся пусто.
        if (v && v !== TITLES[key]) { doc.names[key] = v; }
        else { delete doc.names[key]; }
      }
      no.remove();
      ok.remove();
      if (del) { del.hidden = false; }
      pen.hidden = false;
      // Поле убираем ЗДЕСЬ. Раньше полагались на renderTitles, а он
      // отказывался работать, пока на странице есть открытый ввод —
      // и заголовок так и оставался полем до перезагрузки.
      host.textContent = title(key);
      if (v !== null && v !== was) { queue(); }
      renderTitles();
    }

    // Ушёл фокус — считаем это согласием: набранное сохраняется.
    inp.onblur = function () { finish(inp.value); };
    inp.onkeydown = function (e) {
      if (e.key === 'Enter') { e.preventDefault(); finish(inp.value); }
      if (e.key === 'Escape') { e.preventDefault(); finish(null); }
    };
  }

  function copy(text, btn) {
    var was = btn.textContent;
    function done(ok) {
      btn.textContent = ok ? 'скопировано' : 'не вышло';
      setTimeout(function () { btn.textContent = was; }, 1600);
    }
    function old() {
      // Запасной путь для браузеров без буфера обмена: временное поле,
      // выделение, копирование, уборка.
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.style.cssText = 'position:fixed;top:0;opacity:0';
      document.body.appendChild(ta);
      ta.select();
      var ok = false;
      try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
      ta.remove();
      done(ok);

    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { done(true); }, old);

  }

  /* Список разделов, который можно перетасовать. Своего перетаскивания
     здесь ровно столько, сколько нужно: строк мало, все на виду, поэтому
     двигаем саму строку, без копии-призрака и без FLIP. Правило простое:
     заехал выше середины соседа сверху — меняемся с ним местами. */
  function sortable(list) {
    var held = null;

    /* Слушаем документ, а не список. Захват указателя (setPointerCapture)
       здесь не работает: строку мы двигаем через insertBefore, а это для
       браузера удаление узла — захват слетает. Дальше палец, отпущенный
       за пределами списка, уносил pointerup мимо, строка оставалась
       поднятой с тенью. На документе такого промаха быть не может. */
    function move(e) {
      if (!held) { return; }
      var rows = [].slice.call(list.querySelectorAll('.mrow'));
      var at = rows.indexOf(held);
      var prev = rows[at - 1], next = rows[at + 1], b;
      if (prev) {
        b = prev.getBoundingClientRect();
        if (e.clientY < b.top + b.height / 2) {
          return list.insertBefore(held, prev);
        }
      }
      if (next) {
        b = next.getBoundingClientRect();
        if (e.clientY > b.top + b.height / 2) {
          list.insertBefore(next, held);
        }
      }
    }

    function drop() {
      document.removeEventListener('pointermove', move);
      document.removeEventListener('pointerup', drop);
      document.removeEventListener('pointercancel', drop);
      if (!held) { return; }
      held.classList.remove('lift');
      held = null;
    }

    list.addEventListener('pointerdown', function (e) {
      var g = e.target.closest && e.target.closest('.mgrip');
      if (!g) { return; }
      e.preventDefault();
      drop();                 // на случай брошенного перетаскивания
      held = g.closest('.mrow');
      held.classList.add('lift');
      document.addEventListener('pointermove', move);
      document.addEventListener('pointerup', drop);
      document.addEventListener('pointercancel', drop);
    });
  }

  /* Панель перестановки: строки разделов, под ними «×» и «ок».
     До «ок» документ не трогаем — переставляется только разметка. */
  function fillMover(inner, body) {
    inner.textContent = '';

    var list = document.createElement('div');
    list.className = 'mover';
    LISTS.forEach(function (key) {
      var r = document.createElement('div');
      r.className = 'mrow';
      r.dataset.key = key;
      var g = document.createElement('span');
      g.className = 'mgrip';
      g.textContent = '⠿';
      r.appendChild(g);
      var t = document.createElement('span');
      t.className = 'mname';
      t.textContent = title(key);
      r.appendChild(t);
      list.appendChild(r);
    });
    inner.appendChild(list);
    sortable(list);

    var acts = document.createElement('div');
    acts.className = 'macts';
    inner.appendChild(acts);

    var no = document.createElement('button');
    no.className = 'mno';
    no.textContent = '×';
    no.setAttribute('aria-label', 'отменить перестановку');
    no.onclick = function () { fold(body, false); };
    acts.appendChild(no);

    var ok = document.createElement('button');
    ok.textContent = 'ок';
    ok.setAttribute('aria-label', 'сохранить порядок');
    ok.onclick = function () {
      var seq = [].map.call(list.querySelectorAll('.mrow'),
        function (r) { return r.dataset.key; });
      if (seq.join('|') !== LISTS.join('|')) {
        doc.order = seq;
        relist();
        queue();
        draw();
      }
      shutMenu();
    };
    acts.appendChild(ok);
  }

  var menu = null;

  function shutMenu() {

    sheet.className = 'sheet';
    menu.appendChild(sheet);

    /* Свой раздел заводится только там, где сервер про них знает.
       Страница обновляется на диске сразу, а сервис перезапускают
       руками — в этот промежуток пункта просто нет, и раздел не

    if (proto >= 3) {
      var addRow = document.createElement('button');
      addRow.className = 'row';
      addRow.innerHTML = ADD_SVG + '<span>Добавить новый раздел</span>';
      addRow.onclick = function () {

    if (proto >= 4 && LISTS.length > 1) {

    // круг рисуется поверх уходящего меню.

    document.body.appendChild(menu);

  /* --- поясняющие облачка --- */

  var TIPS = {

  var tipBox = document.getElementById('tip');
  var tipTimer = null;

  var RING = 8;      // зазор подсветки вокруг заголовка (outline-offset + линия)
  var GAP = 14;      // от рамки заголовка до окошка
  var EDGE = 8;      // минимальный отступ от края экрана
  var spotted = null;

  function showTip(btn, key) {
    var t = TIPS[key];
    if (!t) { return; }
    var bubble = tipBox.querySelector('.bubble');

    // Успел нажать другую «i», пока прошлая пояснялка гасла — гашение
    // отменяем, иначе его таймер спрятал бы уже новую.
    clearTimeout(tipTimer);
    tipBox.classList.remove('out');

    tipBox.querySelector('b').textContent = t[0];
    tipBox.querySelector('p').textContent = t[1];
    tipBox.hidden = false;

    // Подсвечиваем только свой блок: название со счётчиком и его кнопку.
    // В строке архива их два, и корзина рядом гаснуть должна вместе со всем.
    if (spotted) { spotted.classList.remove('spot'); }
    spotted = btn.closest('.grp') || btn.closest('h2');
    if (spotted) { spotted.classList.add('spot'); }

    // Высоту меряем с уже подставленным текстом, иначе решение
    // «сверху или снизу» принималось бы по чужому размеру.
    bubble.style.top = '0px';
    var h = bubble.offsetHeight;
    var a = (spotted || btn).getBoundingClientRect();

    /* У корзины заголовок внизу страницы, и окошко под ним целиком
       уходило за экран. Есть место снизу — ставим снизу, нет — сверху. */
    var below = (window.innerHeight - a.bottom - RING - GAP - EDGE) >= h;
    var top = below ? a.bottom + RING + GAP : a.top - RING - GAP - h;
    bubble.style.top = Math.max(EDGE, Math.min(top, window.innerHeight - h - EDGE)) + 'px';
  }

  tipBox.onclick = function () {
    tipBox.classList.add('out');
    if (spotted) { spotted.classList.remove('spot'); spotted = null; }
    tipTimer = setTimeout(function () {
      tipBox.hidden = true;
      tipBox.classList.remove('out');
    }, 160);
  };

  document.addEventListener('click', function (e) {
    var btn = e.target.closest('.info');
    if (btn) { showTip(btn, btn.dataset.tip); return; }
    var pen = e.target.closest('.pen');

    if (del) { askDelete(del.dataset.del); }
