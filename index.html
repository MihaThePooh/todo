  /* --- обмен с сервером --- */

  function api(method, body) {
    return fetch('/api/todo', {
      method: method,
      headers: {
        'Authorization': 'Bearer ' + key,
        'Content-Type': 'application/json'
      },
      body: body ? JSON.stringify(body) : undefined
    });
  }

  /* Первый ответ сервера ещё не пришёл: на экране кэш, а он может
     отставать. Всё, что нажали в это окно, запоминаем и повторяем
     поверх серверного документа — действия адресуют дело по id,
     поэтому повтор ложится на свежие данные правильно.
     Без этого выполненные дела возвращались обратно: ответ GET,
     отправленный ДО нажатия, приходил после и затирал документ. */
  var ready = false;
  var replay = [];
  function early(fn) { if (!ready) { replay.push(fn); } }

  function pull() {
    if (busy()) { return Promise.resolve(); }   // не трогаем открытую правку
    // Есть несохранённое — сервер спрашивать нечего, сначала отдадим своё.
    if (ready && (dirty || sending)) { return Promise.resolve(); }
    say('загрузка…');
    var at = rev;              // метка: на какой правке ушёл запрос
    return api('GET').then(function (r) {
      if (r.status === 401) { say('нет доступа — открой ссылку с ключом', true); throw 0; }
      if (!r.ok) { throw 0; }
      return r.json();
    }).then(function (d) {
      // Пока ждали ответ, могли начать править — тогда ответ выбрасываем,
      // следующий опрос его переспросит.
      if (busy()) { say('сохранено'); return; }
      // Ответ устарел: пока он летел, дела успели поправить. Для ПЕРВОГО
      // ответа это не повод его бросать — наоборот, только он и даёт
      // снимок сервера, а правки мы повторим поверх.
      if (ready && rev !== at) { return; }
      proto = d.proto || 0;
      delete d.proto;
      doc = d;
      relist();     // набор разделов задаёт документ, не константа
      synced = clone(doc);
      // Полночь могла наступить, пока страница висела открытой или
      // лежала закрытой. Если что-то переехало в архив — сохраняем,
      // иначе сервер продолжит присылать вчерашние дела как сегодняшние.
      var moved = purge();
      var redo = replay;
      replay = [];
      ready = true;
      // Каждое повторённое действие само зовёт queue() и draw().
      redo.forEach(function (f) { f(); });
      draw();
      // Кэш обновляем и здесь, не только при своих правках. Раньше он
      // застывал на последней ЛОКАЛЬНОЙ правке: правил с телефона —
      // ноутбук при следующем открытии показывал позавчерашний список,
      // пока не придёт ответ сервера.
      try { localStorage.setItem(CACHE, JSON.stringify(doc)); }
      catch (e) { /* приватный режим — переживём */ }
      if (!redo.length) { say('сохранено'); }
      if (moved) { queue(); }
    }).catch(function () {
      ready = true;
      replay = [];       // на экране кэш, действия к нему уже применены
      var c = localStorage.getItem(CACHE);
      if (c) { doc = JSON.parse(c); relist(); draw(); say('нет связи — показан черновик', true); }
      else { draw(); say('нет связи', true); }   // draw убирает заглушки
    }).then(function () {
      // Сохранение, придержанное до снимка, отпускаем. Свой таймер
      // мог уже отработать вхолостую, поэтому заводим заново.
      if (dirty && !sending) { clearTimeout(timer); timer = setTimeout(push, 300); }
    });
  }

  function queue() {
    dirty = true;
    rev++;
    localStorage.setItem(CACHE, JSON.stringify(doc));
    say('…');
    clearTimeout(timer);
    timer = setTimeout(push, 600);   // не дёргать сервер на каждую букву
  }

  function clone(o) { return JSON.parse(JSON.stringify(o)); }

  // Документ без черновиков — ровно то, что имеет право уехать.
  function real() {
    var out = clone(doc);
    LISTS.forEach(function (n) {
      out[n] = (out[n] || []).filter(function (t) { return !t.draft; });
    });
    return out;
  }

  /* Разница между тем, что на экране, и тем, что на сервере.

     Для каждого затронутого раздела шлём порядок id и только те дела,
     чьё содержимое изменилось. Остальные сервер возьмёт у себя по id.
     Иначе вклеенная в дело статья на мегабайт улетала бы заново на
     каждую галочку в любом другом разделе. */
  function changes(now) {
    var was = {};
    STORED.forEach(function (name) {
      (synced[name] || []).forEach(function (t) { was[t.id] = JSON.stringify(t); });
    });

    var body = { base: doc.updated || '', lists: {} };
    var any = false;
    STORED.forEach(function (name) {
      var rows = now[name] || [];
      var ids = rows.map(function (t) { return t.id; });
      var old = (synced[name] || []).map(function (t) { return t.id; });
      var tasks = {};
      var touched = false;
      rows.forEach(function (t) {
        if (was[t.id] !== JSON.stringify(t)) { tasks[t.id] = t; touched = true; }
      });
      if (touched || ids.join('|') !== old.join('|')) {
        body.lists[name] = { ids: ids, tasks: tasks };
        any = true;
      }
    });
    if (JSON.stringify(doc.names || {}) !== JSON.stringify(synced.names || {})) {
      body.names = doc.names || {};
      any = true;
    }
    // Набор своих разделов. Шлём только когда он менялся: сервер
    // принимает его как есть, и пустой список означал бы «разделов нет».
    if (JSON.stringify(doc.extra || []) !== JSON.stringify(synced.extra || [])) {
      body.extra = doc.extra || [];
      any = true;
    }
    if (JSON.stringify(doc.off || []) !== JSON.stringify(synced.off || [])) {
      body.off = doc.off || [];
      any = true;
    }
    if (JSON.stringify(doc.order || []) !== JSON.stringify(synced.order || [])) {
      body.order = doc.order || [];
      any = true;
    }
    return any ? body : null;
  }

  function push() {
    if (sending || !dirty) { return; }
    /* Первый ответ сервера ещё не пришёл — отправлять рано. Снимка нет,
       и запрос ушёл бы целым документом со ссылкой на состояние из кэша.
       Дальше выходило вот что: сохранение проходило, сервер обновлял
       свою отметку времени, а следом приземлялся ответ GET, отправленный
       ЕЩЁ РАНЬШЕ, — с уже устаревшей отметкой. Следующее сохранение
       ссылалось на неё, сервер отвечал 409, приложение принимало его
       версию — и только что нажатое исчезало. Ждём снимок: он придёт
       через доли секунды, а правка никуда не денется, она в кэше. */
    if (!ready) { return; }
    var now = real();
    var body;
    if (synced && proto >= 2) {
      body = changes(now);
      // Правки свелись к нулю (например, отменили то же, что и завели).
      if (!body) { dirty = false; say('сохранено'); return; }
    } else {
      // Снимка ещё нет: первое сохранение нового списка. Шлём целиком.
      body = now;
      body.base = doc.updated || '';
    }
    sending = true;
    sentRev = rev;
    api('PUT', body).then(function (r) {
      sending = false;
      if (r.status === 409) {
        // Кто-то (телефон или другая вкладка) успел раньше.
        return r.json().then(function (d) {
          if (busy()) { return; }   // правку не сносим, разберёмся после неё
          doc = d.current;
          relist();
          synced = clone(doc);
          purge(); draw();
          say('данные обновлены с сервера', true);
          dirty = false;
        });
      }
      if (r.status === 429 || r.status === 507) {
        // Сервер отказался заводить ЕЩЁ один список. Повторять смысла
        // нет: список дел никуда не денется, он лежит в браузере.
        dirty = false;
        say(r.status === 429
          ? 'новый список — не чаще трёх в сутки'
          : 'на сервере нет места под новый список', true);
        return;
      }
      if (!r.ok) { throw 0; }
      return r.json().then(function (d) {
        doc.updated = d.updated;
        // Снимок — ровно то, что уехало, а не то, что на экране сейчас:
        // пока шёл запрос, могли поправить ещё раз.
        synced = now;
        synced.updated = d.updated;
        localStorage.setItem(CACHE, JSON.stringify(doc));
        if (rev === sentRev) {
          dirty = false;
          say('сохранено');
        } else {
          setTimeout(push, 150);   // успели поправить — досылаем
        }
      });
    }).catch(function () {
      sending = false;
      say('не сохранено — повтор', true);
      setTimeout(push, 8000);
    });
  }

  /* --- данные --- */

  // Начало сегодняшних суток по часам телефона. new Date() всегда
  // местное время, поэтому список сам переедет вместе с хозяином:
  // в новом часовом поясе полночь наступит по новому времени.
  function midnight() {
    var d = new Date();
    d.setHours(0, 0, 0, 0);
    return d.getTime();
  }

  function purge() {
    var now = Date.now();
    var today = midnight();
    var changed = false;
    doc.done = doc.done || [];
    doc.archive = doc.archive || [];
    var stay = [];
    doc.done.forEach(function (t) {
      // Календарные сутки, а не скользящие 24 часа: сделанное в 8 утра
      // висит до 23:59 того же дня и уезжает в архив ровно в полночь.
      if ((t.doneAt || 0) >= today) { stay.push(t); }
      else { doc.archive.unshift(t); changed = true; }
    });
    doc.done = stay;
    // Год в архиве — и удаляем насовсем.
    doc.archive = doc.archive.filter(function (t) { return (t.doneAt || 0) > now - YEAR; });
    // Свежее сверху, старое внизу.
    doc.archive.sort(function (a, b) { return (b.doneAt || 0) - (a.doneAt || 0); });

    // Корзина: неделя на передумать, дальше стирается насовсем.
    doc.bin = (doc.bin || []).filter(function (t) { return (t.delAt || 0) > now - WEEK; });
    doc.bin.sort(function (a, b) { return (b.delAt || 0) - (a.delAt || 0); });

    return changed;   // переезд в архив надо донести до сервера
  }

  function find(id) {
    var all = STORED;
    for (var i = 0; i < all.length; i++) {
      var arr = doc[all[i]];
      for (var j = 0; j < arr.length; j++) {
        if (arr[j].id === id) { return { list: all[i], idx: j, task: arr[j] }; }
      }
    }
    return null;
  }

  /* --- отрисовка --- */

  function linkify(text) {
    var out = document.createDocumentFragment();
    var re = /(https?:\/\/[^\s<>"']+)/g, last = 0, mm;
    while ((mm = re.exec(text))) {
      if (mm.index > last) { out.appendChild(document.createTextNode(text.slice(last, mm.index))); }
      var a = document.createElement('a');
      a.href = mm[1];
      a.target = '_blank';
      a.rel = 'noopener';
      a.textContent = mm[1];
      out.appendChild(a);
      last = mm.index + mm[1].length;
    }
    if (last < text.length) { out.appendChild(document.createTextNode(text.slice(last))); }
    return out;
  }

  function stamp(ms) {
    var d = new Date(ms || 0);
    return ('0' + d.getDate()).slice(-2) + '.' + ('0' + (d.getMonth() + 1)).slice(-2) + '.' + d.getFullYear();
  }

  // Контурное ведро: рисуем вектором, а не эмодзи — эмодзи на каждой
  // системе своё и в кнопку по цвету не попадает.
  var TRASH_SVG =
    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" ' +
    'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
    '<path d="M9.4 5.7v-.5a2.6 2.6 0 0 1 5.2 0v.5"/>' +
    '<path d="M3.6 8.4l.5-1.6a1.6 1.6 0 0 1 1.5-1.1h12.8a1.6 1.6 0 0 1 1.5 1.1l.5 1.6z"/>' +
    '<path d="M5.9 9.2l.85 9.5a2 2 0 0 0 2 1.8h6.5a2 2 0 0 0 2-1.8l.85-9.5"/>' +
    '<path d="M9.6 11.8v5.9M12 11.8v5.9M14.4 11.8v5.9"/>' +
    '</svg>';

  var STAR_SVG =
    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"' +
    ' stroke-width="1.7" stroke-linejoin="round" width="24" height="24">' +
    '<path d="M12 3.5l2.7 5.45 6.02.88-4.36 4.24 1.03 5.99L12 17.22' +
    'l-5.39 2.84 1.03-5.99L3.28 9.83l6.02-.88z"/>' +
    '</svg>';

  function row(task, listName) {
    var el = document.createElement('div');
    el.className = 'item' + (task.star ? ' star' : '');
    el.dataset.id = task.id;

    // .card — видимая карточка с рамкой; она целиком уезжает влево
    // при смахивании. .face — только раскладка содержимого внутри.
    var card = document.createElement('div');
    card.className = 'card';
    el.appendChild(card);

    var face = document.createElement('div');
    face.className = 'face';
    card.appendChild(face);

    // Корзина: слева текст, справа возврат. Сколько дней осталось —
    // мелким, чтобы было видно, когда дело сотрётся само.
    if (listName === 'bin') {
      if (task.sec) {
        // Целый раздел. Отличается от дела с первого взгляда: зелёная
        // грань слева, значок стопки, имя жирным и подпись со счётом.
        el.className += ' sec';
        var icon = document.createElement('span');
        icon.className = 'secicon';
        icon.innerHTML = STACK_SVG;
        face.appendChild(icon);

        var st = document.createElement('div');
        st.className = 'txt';
        var nm = document.createElement('b');
        nm.textContent = task.text || 'Раздел';
        st.appendChild(nm);
        var sub = document.createElement('span');
        sub.className = 'sub';
        var n = (task.rows || []).length;
        // Точка — разделитель в одной строке с именем, а не подпись снизу.
        sub.textContent = ' · ' + (n ? n + ' ' + cases(n) : 'пусто');
        st.appendChild(sub);
        face.appendChild(st);
      } else {
        var bt = document.createElement('div');
        bt.className = 'txt';
        bt.appendChild(linkify(task.text));
        face.appendChild(bt);
      }

      var left = Math.max(0, Math.ceil(((task.delAt || 0) + WEEK - Date.now()) / DAY));
      var bw = document.createElement('div');
      bw.className = 'when';
      bw.textContent = left + ' дн.';
      face.appendChild(bw);

      var u = document.createElement('button');
      u.className = 'undo';
      u.textContent = '↩';
      u.setAttribute('aria-label', task.sec ? 'вернуть раздел' : 'восстановить');
      u.onclick = function () {
        afterButton();
        vanish(el, function () { restore(task.id); });
      };
      face.appendChild(u);
      return el;
    }

    // Архив только читается: ни перетаскивания, ни кнопок.
    if (listName === 'archive') {
      var at = document.createElement('div');
      at.className = 'txt';
      at.appendChild(linkify(task.text));
      face.appendChild(at);
      var w = document.createElement('div');
      w.className = 'when';
      w.textContent = stamp(task.doneAt);
      face.appendChild(w);
      return el;
    }

    if (listName !== 'done') {
      var g = document.createElement('div');
      g.className = 'grip';
      g.textContent = '⠿';
      face.appendChild(g);
    }

    var b = document.createElement('button');
    if (listName === 'done') {
      // В «сделано» галочка — просто метка, а не кнопка: вернуть дело
      // можно только стрелкой справа. Иначе оно отменялось случайным
      // касанием при прокрутке.
      b.className = 'box mark';
      b.textContent = '✓';
      b.disabled = true;
      b.setAttribute('aria-label', 'сделано');
    } else {
      b.className = 'box';
      b.setAttribute('aria-label', 'сделано');
      var fired = false;
      b.onclick = function () {
        if (task.draft || fired) { return; }
        fired = true;
        // Сначала галочка встаёт на место, и только потом дело улетает
        // в «сделано»: иначе исчезает раньше, чем глаз успел подтвердить.
        b.classList.add('ticked');
        b.textContent = '✓';
        setTimeout(function () { toggle(task.id); }, 300);
      };
    }
    face.appendChild(b);

    var t = document.createElement('div');
    t.className = 'txt';
    if (!task.draft) {
      t.appendChild(linkify(task.text));
    }
    if (!task.draft && listName !== 'done') {
      t.onclick = function (e) {
        if (e.target.tagName === 'A') { return; }   // по ссылке — переход, не правка
        // Правка уже открыта: тап внутри поля — это установка курсора,
        // клик всплывает сюда же. Без этой проверки edit() запускался
        // повторно, старое поле сносилось, его blur вызывал сохранение —
        // и карточка закрывалась, будто нажали «ок».
        if (t.querySelector('textarea')) { return; }
        if (closeSwipe(el)) { return; }             // карточка была отодвинута — сначала закрыть
        edit(t, task);
      };
    }
    face.appendChild(t);

    if (task.draft) {
      // Порядок: сначала «×», справа от него «ок».
      var no = document.createElement('button');
      no.className = 'nope';
      no.textContent = '×';
      no.setAttribute('aria-label', 'не добавлять');
      // Черновик пропадает ТОЛЬКО отсюда: недописанное дело
      // само по себе никуда не денется и никуда не добавится.
      no.onpointerdown = function (e) { e.preventDefault(); afterButton(); dropDraft(task.id); };
      face.appendChild(no);

      var ok = document.createElement('button');
      ok.className = 'ok';
      ok.textContent = 'ок';
      // pointerdown вместо click: иначе поле сначала теряет фокус,
      // строка успевает исчезнуть, и до click дело не доходит.
      ok.onpointerdown = function (e) { e.preventDefault(); afterButton(); commitDraft(task.id); };
      face.appendChild(ok);
      return el;
    }

    if (listName === 'done') {
      // Из «сделано» кнопка возвращает дело в его прежний раздел.
      // Насовсем оно уйдёт через год из архива.
      var k = document.createElement('button');
      k.className = 'kill';
      k.textContent = '↩';
      k.setAttribute('aria-label', 'вернуть в список');
      k.onclick = function () { toggle(task.id); };
      face.appendChild(k);
      return el;
    }

    // Обычное дело: удаляется смахиванием влево, кнопка прячется под карточкой.
    var trash = document.createElement('button');
    trash.className = 'trash';
    trash.innerHTML = TRASH_SVG;
    trash.setAttribute('aria-label', 'удалить');
    // pointerdown, а не click: карточка отъезжает и перерисовывается, и
    // click иногда уже не находил под пальцем ту же кнопку — приходилось
    // тапать дважды.
    trash.onpointerdown = function (e) {
      e.preventDefault();
      afterButton();
      // Строка сначала схлопывается на месте вместе с корзиной, и только
      // потом правится список: соседи подтягиваются плавно, а не прыжком.
      vanish(el, function () { remove(task.id); });
    };
    el.insertBefore(trash, card);

    // Звезда: включает и выключает кольцо. Карточка после нажатия
    // закрывается сама — второй жест ради того же действия не нужен.
    var fav = document.createElement('button');
    fav.className = 'fav' + (task.star ? ' lit' : '');
    fav.innerHTML = STAR_SVG;
    fav.setAttribute('aria-label', task.star ? 'снять выделение' : 'выделить');
    fav.onpointerdown = function (e) {
      e.preventDefault();
      afterButton();
      var on = !fav.classList.contains('lit');
      fav.classList.toggle('lit', on);
      el.classList.toggle('star', on);
      // Разгорание — только здесь, на живом нажатии.
      if (on) {
        el.classList.add('fresh');
        setTimeout(function () { el.classList.remove('fresh'); }, 600);
      }
      fav.setAttribute('aria-label', on ? 'снять выделение' : 'выделить');
      star(task.id, on);
      // Сначала видно, что звезда загорелась, и только потом карточка
      // уезжает обратно. Наоборот подтверждение проскакивало бы мимо глаз.
      setTimeout(function () { shut(el); }, 300);
    };
    el.insertBefore(fav, card);

    return el;
  }

  /* --- движение ---
     Список целиком пересобирается на каждое действие, поэтому все
     перемещения происходили мгновенно. Приём называется FLIP:
     First — запомнили, где карточки были;
     Last — собрали разметку заново, браузер расставил их по-новому;
     Invert — трансформом сдвигаем каждую обратно в старое место;
     Play — снимаем трансформ, браузер доезжает сам.
     Дёшево: разметка не двигается, двигается только композитор. */

  var MOVE = 'transform .3s cubic-bezier(.2,.8,.2,1)';
  var justAdded = null;   // id строки, которая должна проявиться

  /* Заголовки разделов едут по тем же правилам, что и карточки.
     Двигаем именно h2, а не всю section: секция — родитель списка,
     сдвинув её, мы утащили бы вместе с ней все карточки внутри,
     а у каждой из них уже есть собственный сдвиг. Вышло бы двойное
     смещение. h2 — сосед списка, его можно двигать в одиночку. */
  function headKey(h) {
    var sec = h.parentNode;
    return 'h:' + (sec.dataset.sec || sec.id || h.id || '');
  }

  function moving() {
    var out = [];
    [].forEach.call(document.querySelectorAll('.item[data-id]'), function (el) {
      if (el.classList.contains('ghost')) { return; }
      out.push(['i:' + el.dataset.id, el]);
    });
    [].forEach.call(document.querySelectorAll('section > h2'), function (el) {
      out.push([headKey(el), el]);
    });
    return out;
  }

  function snap() {
    var map = {};
    moving().forEach(function (pair) {
      var r = pair[1].getBoundingClientRect();
      if (!r.height) { return; }   // спрятанная на время перетаскивания
      map[pair[0]] = r;
    });
    return map;
  }

  function flip(before) {
    moving().forEach(function (pair) {
      var el = pair[1];
      // у новой строки и у нового раздела своя анимация появления
      if (el.classList.contains('in')) { return; }
      if (el.parentNode.classList.contains('born')) { return; }
      var was = before[pair[0]];
      if (!was) { return; }
      var now = el.getBoundingClientRect();
      var dx = was.left - now.left, dy = was.top - now.top;
      if (!dx && !dy) { return; }
      el.style.transition = 'none';
      el.style.transform = 'translate(' + dx + 'px,' + dy + 'px)';
      requestAnimationFrame(function () {
        el.style.transition = MOVE;
        el.style.transform = '';
      });
    });
  }

  // Карточка схлопывается на месте, и только потом трогаем данные:
  // иначе соседи прыгают вверх раньше, чем глаз успевает за ними.
  function vanish(el, done) {
    var h = el.getBoundingClientRect().height;
    el.style.height = h + 'px';
    el.style.overflow = 'hidden';
    requestAnimationFrame(function () {
      el.style.transition = 'height .24s ease, opacity .2s ease, margin-bottom .24s ease';
      el.style.height = '0px';
      el.style.opacity = '0';
      el.style.marginBottom = '0px';
    });
    setTimeout(done, 250);
  }

  // Своя прокрутка: focus() у поля ввода дёргает страницу рывком,
  // поэтому фокус ставим без прокрутки, а доезжаем сами.
  /* Ставит строку в середину ВИДИМОЙ части экрана. Видимой, а не всей:
     когда снизу выехала клавиатура, window.innerHeight её не замечает —
     на Android Chrome ужимается только визуальная область, а разметка
     остаётся прежней высоты. Считая по innerHeight, мы ставили строку
     в середину полного экрана, то есть ровно под клавиатуру. */
  function glide(el) {
    var vv = window.visualViewport;
    var view = vv ? vv.height : window.innerHeight;
    var off = vv ? vv.offsetTop : 0;
    var box = el.getBoundingClientRect();
    var to = window.scrollY + box.top - off - (view - box.height) / 2;
    to = Math.max(0, Math.min(to, document.body.scrollHeight - window.innerHeight));
    try { window.scrollTo({ top: to, behavior: 'smooth' }); }
    catch (e) { window.scrollTo(0, to); }
  }

  /* Клавиатура ничего не сдвигает — она накрывает страницу снизу.
     Поэтому у последних строк списка просто нет места, куда уехать:
     прокрутка уже в самом низу, ниже пусто. Подкладываем страницы
     ровно в рост клавиатуры — и появляется куда прокручивать.
     Слушатель заведён раньше того, что доводит строку до середины:
     сначала место, потом переезд. */
  if (window.visualViewport) {
    (function () {
      var vv = window.visualViewport;
      vv.addEventListener('resize', function () {
        var gap = Math.max(0, Math.round(window.innerHeight - vv.height - vv.offsetTop));
        document.body.style.paddingBottom = gap ? gap + 'px' : '';
      });
    }());
  }

  // Разворачивание полки: height от 0 до фактической и обратно.
  // auto анимировать нельзя, поэтому меряем и подставляем число.
  function fold(box, show, done) {
    if (show) {
      box.hidden = false;
      var h = box.scrollHeight;
      box.style.overflow = 'hidden';
      box.style.height = '0px';
      requestAnimationFrame(function () { box.style.height = h + 'px'; });
      setTimeout(function () {
        box.style.height = '';
        box.style.overflow = '';
        if (done) { done(); }
      }, 260);
    } else {
      box.style.overflow = 'hidden';
      box.style.height = box.scrollHeight + 'px';
      requestAnimationFrame(function () { box.style.height = '0px'; });
      setTimeout(function () {
        box.hidden = true;
        box.style.height = '';
        box.style.overflow = '';
      }, 260);
    }
  }

  // before — снимок позиций, сделанный заранее. Нужен там, где разметка
  // успела измениться до перерисовки: снятый после этого снимок описывал
  // бы уже не то состояние, и FLIP проигрывал бы движение, которого
  // на самом деле не было.
  function draw(before) {
    before = before || snap();
    mountSections();   // свои разделы могли появиться в ответе сервера
    // Разметка пересоздаётся — старые ссылки на карточки протухают.
    opened = null;
    swipe = null;
    ALL.forEach(function (name) {
      var host = document.getElementById(name);
      host.innerHTML = '';
      if (!doc[name].length) {
        var e = document.createElement('div');
        e.className = 'empty';
        e.textContent = name === 'done' ? 'пока ничего'
          : name === 'archive' ? 'архив пуст'
          : name === 'bin' ? 'корзина пуста'
          : 'пусто';
        host.appendChild(e);
      }
      doc[name].forEach(function (task) {
        var el = row(task, name);
        if (task.id === justAdded) { el.classList.add('in'); }
        host.appendChild(el);
      });
    });
    justAdded = null;

    /* Тексты заголовков проставляем ДО flip(). Счётчик «Сделано за
       сегодня — N» и пометка архива живут внутри h2, а h2 теперь тоже
       участвует в анимации: подмени текст после замера — и заголовок
       доедет не туда, где он на самом деле окажется. */
    renderTitles();
    document.getElementById('cnt').textContent = doc.done.length;
    var arcCnt = document.getElementById('arcCnt');
    arcCnt.textContent = '';
    if (doc.archive.length) {
      ['—', String(doc.archive.length)].forEach(function (part) {
        var sp = document.createElement('span');
        sp.textContent = part;
        arcCnt.appendChild(sp);
      });
    }
    document.getElementById('binCnt').textContent = doc.bin.length || '';

    flip(before);

    // Черновик рисуется уже открытым на ввод.
    var d = document.querySelector('.item .ok');
    if (d) { openDraft(d.closest('.item')); }
  }

  /* --- действия --- */

  /* Кнопки на карточке срабатывают по pointerdown и тут же перерисовывают
     строку. Но касание на этом не кончилось: браузер добивает его обычным
     click — и попадает уже в НОВУЮ строку на том же месте, открывая её на
     правку. Гасим первый клик после нажатия любой такой кнопки.
     Перехват в фазе capture: до того, как клик дойдёт до строки. */
  var swallowUntil = 0;
  function afterButton(ms) { swallowUntil = Date.now() + (ms || 500); }
  document.addEventListener('click', function (e) {
    if (Date.now() < swallowUntil) { e.stopPropagation(); e.preventDefault(); }
  }, true);

  function edit(node, task) {
    if (node.querySelector('textarea')) { return; }   // второй заход запрещён
    var ta = document.createElement('textarea');
    // rows=1 обязательно. По умолчанию у textarea две строки, и при
    // height:auto она занимает две — scrollHeight возвращал их же,
    // поэтому однострочное дело при тапе раздувалось вдвое и оседало
    // обратно только после сохранения.
    ta.rows = 1;
    ta.value = task.text;
    node.textContent = '';
    node.appendChild(ta);

    var saved = false;
    function save() {
      if (saved) { return; }     // и blur, и кнопка ведут сюда — сохраняем один раз
      saved = true;
      var v = ta.value.trim();
      if (v && v !== task.text) { task.text = v; queue(); }
      draw();
    }

    // Кнопка «ок» — чтобы дописать и сохранить пальцем, без Enter.
    var ok = document.createElement('button');
    ok.className = 'ok';
    ok.textContent = 'ок';
    ok.onpointerdown = function (e) { e.preventDefault(); afterButton(); save(); };
    node.parentNode.appendChild(ok);

    // Высоту считаем ТОЛЬКО после того, как кнопка встала на место:
    // она отбирает ширину, строка переносится, и замер до неё врал —
    // поле оставалось в одну строку, а текст в нём уезжал вверх.
    var fit = function () { ta.style.height = 'auto'; ta.style.height = ta.scrollHeight + 'px'; };
    fit();
    ta.oninput = fit;
    if (!demo) {
      try { ta.focus({ preventScroll: true }); } catch (e) { ta.focus(); }
      ta.setSelectionRange(ta.value.length, ta.value.length);
    }

    ta.onblur = save;
    ta.onkeydown = function (e) {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); ta.blur(); }
      if (e.key === 'Escape') { ta.value = task.text; ta.blur(); }
    };

    // Ровно то же, что и у нового дела: строка доводится до середины
    // видимой части экрана, а когда снизу выедет клавиатура — ещё раз.
    // Без этого правка дела из нижнего раздела уходила под клавиатуру,
    // и вытащить её оттуда было нечем.
    var item = node.closest && node.closest('.item');
    if (item && !demo) { keepInView(item); }
  }

  /* Довести строку до видимой части и удержать её там, пока выезжает
     клавиатура. Вынесено отдельно: этим пользуются и черновик, и правка
     уже существующего дела. */
  function keepInView(el) {
    requestAnimationFrame(function () { glide(el); });
    var vv = window.visualViewport;
    if (!vv) { return; }
    var again = function () {
      if (document.body.contains(el)) { glide(el); }
    };
    vv.addEventListener('resize', again);
    setTimeout(function () { vv.removeEventListener('resize', again); }, 1500);
  }

  /* Запомнить, где дело стояло, перед тем как унести его в «сделано»
     или в корзину. Пишем не номер, а id соседа сверху: пока дело лежит
     в стороне, список живёт своей жизнью — что-то добавили, что-то
     убрали, — и номер к моменту возврата уже врёт. Сосед не врёт.
     Номер держим вторым эшелоном: соседа тоже могли убрать.
     Первая строка — особый случай: соседа сверху нет, пишем пустую
     строку, и это не то же самое, что «не знаю». */
  function keepSpot(task, list, idx) {
    task.aft = idx > 0 ? doc[list][idx - 1].id : '';
    task.at = idx;
  }

  /* Положить дело туда, откуда его забрали. */
  function putBack(task, list) {
    var arr = doc[list] || (doc[list] = []);
    var pos = null;
    if (task.aft) {
      for (var i = 0; i < arr.length; i++) {
        if (arr[i].id === task.aft) { pos = i + 1; break; }
      }
    } else if (task.aft === '') {
      pos = 0;                                   // стояло первым
    }
    if (pos === null) {
      pos = typeof task.at === 'number' ? task.at : 0;
    }
    delete task.aft;
    delete task.at;
    arr.splice(Math.max(0, Math.min(pos, arr.length)), 0, task);
  }

  function toggle(id) {
    early(function () { toggle(id); });
    var f = find(id);
    if (!f) { return; }
    if (f.list === 'done') {
      doc[f.list].splice(f.idx, 1);
      f.task.doneAt = 0;
      var back = f.task.from || 'free';
      if (LISTS.indexOf(back) < 0) { back = LISTS[0]; }
      putBack(f.task, back);
    } else {
      keepSpot(f.task, f.list, f.idx);
      doc[f.list].splice(f.idx, 1);
      f.task.from = f.list;              // чтобы вернуть туда же
      f.task.doneAt = Date.now();
      doc.done.unshift(f.task);
    }
    queue(); draw();
  }

  // Удаление не стирает дело, а кладёт его в корзину на неделю.
  // Выделение живёт прямо в деле и уезжает на сервер вместе с ним.
  // draw() здесь звать нельзя: перерисовка оборвала бы анимацию кольца
  // и рывком закрыла бы карточку.
  function star(id, on) {
    early(function () { star(id, on); });
    var f = find(id);
    if (!f) { return; }
    if (on) { f.task.star = true; } else { delete f.task.star; }
    queue();
  }

  function remove(id) {
    early(function () { remove(id); });
    var f = find(id);
    if (!f) { return; }
    keepSpot(f.task, f.list, f.idx);
    doc[f.list].splice(f.idx, 1);
    f.task.binFrom = f.list;      // куда вернуть, если передумает
    f.task.delAt = Date.now();
    doc.bin.unshift(f.task);
    queue(); draw();
  }

  /* Вернуть из корзины целый раздел вместе с делами. */
  function restoreSection(entry, idx) {
    var key = entry.sec;
    var own = doc.extra || [];
    if (EXTRA_RE.test(key) && own.indexOf(key) < 0 && own.length >= MAX_EXTRA) {
      say('сначала освободите место: разделов уже ' + MAX_EXTRA, true);
      return;
    }
    doc.bin.splice(idx, 1);

    if (EXTRA_RE.test(key)) {
      if (own.indexOf(key) < 0) { doc.extra = own.concat([key]); }
    } else {
      doc.off = (doc.off || []).filter(function (n) { return n !== key; });
    }
    // Название пережило удаление в самой записи корзины.
    if (entry.text && entry.text !== TITLES[key]) {
      doc.names = doc.names || {};
      doc.names[key] = entry.text;
    }
    relist();
    // Дело с таким id могло за неделю появиться заново — тогда копию
    // из корзины не поднимаем, иначе в списке окажутся два одинаковых.
    doc[key] = (entry.rows || []).filter(function (t) { return !find(t.id); });
    doc[key].forEach(function (t) { delete t.delAt; delete t.binFrom; });
    queue();
    draw();
    var host = document.querySelector('section[data-sec="' + key + '"]');
    if (host) {
      host.classList.add('born');
      setTimeout(function () { host.classList.remove('born'); }, 700);
      try { host.scrollIntoView({ behavior: 'smooth', block: 'center' }); }
      catch (e) { host.scrollIntoView(); }
    }
  }

  function restore(id) {
    early(function () { restore(id); });
    var f = find(id);
    if (!f || f.list !== 'bin') { return; }
    if (f.task.sec) { return restoreSection(f.task, f.idx); }
    doc.bin.splice(f.idx, 1);
    var back = f.task.binFrom;
    // Раздел могли удалить, пока дело лежало в корзине.
    if (LISTS.indexOf(back) < 0) { back = LISTS[0]; }
    delete f.task.delAt;
    delete f.task.binFrom;
    putBack(f.task, back);
    justAdded = id;    // в новом списке дело проявляется, а не возникает
    queue(); draw();
  }

  /* --- добавление: пустое дело прямо в списке --- */

  /* Через делегирование, а не перебором кнопок при загрузке: у своих
     разделов разметка появляется позже, и на прямой обработчик их «+»
     уже не попал бы. */
  document.addEventListener('click', function (e) {
    var btn = e.target.closest && e.target.closest('.plus');
    if (!btn) { return; }
    var list = btn.dataset.add;
    if (!doc[list]) { return; }        // раздел успели убрать с другого устройства
    dropDrafts();
    var id = uid();
    doc[list].push({ id: id, text: '', draft: true });
    justAdded = id;
    draw();     // draw сам откроет черновик на ввод
  });

  // Жмут «+» в другом разделе: пустой черновик убираем, а уже
  // написанный не теряем — дописанный текст фиксируем как дело.
  function dropDrafts() {
    LISTS.forEach(function (name) {
      doc[name] = doc[name].filter(function (t) {
        if (!t.draft) { return true; }
        if (!(t.text || '').trim()) { return false; }
        t.text = t.text.trim();
        delete t.draft;
        return true;
      });
    });
  }

  // Черновик рисуется уже с полем ввода и поднятой клавиатурой.
  function openDraft(el) {
    var host = el.querySelector('.txt');
    if (host.querySelector('textarea')) { return; }
    var f = find(el.dataset.id);
    if (!f) { return; }

    var ta = document.createElement('textarea');
    ta.rows = 1;
    ta.placeholder = 'Что сделать';
    ta.enterKeyHint = 'done';
    // Набранное восстанавливаем из самого дела. Раньше поле создавалось
    // пустым, и любая перерисовка списка (например, когда рядом
    // перетащили другое дело) стирала текст с экрана, хотя в памяти
    // он был.
    ta.value = f.task.text || '';
    host.appendChild(ta);
    var fit = function () { ta.style.height = 'auto'; ta.style.height = ta.scrollHeight + 'px'; };
    fit();
    ta.oninput = function () { fit(); f.task.text = ta.value; };
    if (!demo) {
      // preventScroll: иначе браузер сам швыряет страницу к полю рывком.
      try { ta.focus({ preventScroll: true }); } catch (e) { ta.focus(); }
      ta.setSelectionRange(ta.value.length, ta.value.length);
    }
    ta.onkeydown = function (e) {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); commitDraft(f.task.id); }
      if (e.key === 'Escape') { dropDraft(f.task.id); }
    };
    // Клик мимо черновик НЕ убивает: уйти он может только через «×».
    // Доводим строку до видимой части и держим её там, пока снизу
    // выезжает клавиатура, — тем же кодом, что и правка дела.
    if (!demo) { keepInView(el); }
  }

  // Отмена: недописанное дело выкидывается и никуда не сохраняется.
  function dropDraft(id) {
    var f = find(id);
    if (!f) { return; }
    doc[f.list].splice(f.idx, 1);
    draw();   // queue не зовём: на сервере этого дела и не было
  }

  function commitDraft(id) {
    var f = find(id);
    if (!f) { return; }
    var v = (f.task.text || '').trim();
    if (!v) { doc[f.list].splice(f.idx, 1); draw(); return; }
    f.task.text = v;
    delete f.task.draft;
    queue(); draw();
  }

  /* --- архив и корзина: две сворачивающиеся полки в одной строке --- */

  document.getElementById('binIcon').innerHTML = TRASH_SVG;

  // Карандаш: диагональный корпус и остриё. Рисуем вектором по той же
  // причине, что и корзину, — эмодзи на каждой системе своё.
  var PEN_SVG =
    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" ' +
    'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
    '<path d="M14.5 4.5l5 5"/>' +
    '<path d="M17 2l5 5-12.5 12.5L3 22l2.5-6.5z"/>' +
    '</svg>';
  paintIcons();

  var arcHead = document.getElementById('arcHead');
  var binBtn = document.getElementById('binBtn');
  var arcBox = document.getElementById('archive');
  var binBox = document.getElementById('bin');

  /* Полка всегда одна. Раньше архив и корзина открывались независимо,
     и вторая просто отпихивала первую вниз. Состояние держим в
     переменной, а не читаем hidden: закрытие анимированное, и hidden
     сбрасывается не сразу — быстрые тапы читали бы устаревшее. */
  var shelf = null;   // 'archive' | 'bin' | null

  /* Полка раскрывается вниз, за нижний край экрана, и до содержимого
     приходилось скроллить. Доводим страницу так, чтобы низ полки совпал
     с низом экрана. Если содержимое выше экрана — упираемся в её верх,
     иначе начало уехало бы за шапку.
     Считаем ПОСЛЕ анимации: пока полка растёт, документ ещё короткий
     и браузер обрежет прокрутку по текущей высоте страницы. */
  function reveal(box) {
    var r = box.getBoundingClientRect();
    var head = document.querySelector('header').getBoundingClientRect().height;
    var title = document.getElementById('footHead').getBoundingClientRect();

    var bottom = window.scrollY + r.bottom + 14;      // +воздух под последней строкой
    var to = bottom - window.innerHeight;
    var topLimit = window.scrollY + title.top - head - 8;
    to = Math.min(to, topLimit);
    to = Math.max(0, to);
    try { window.scrollTo({ top: to, behavior: 'smooth' }); }
    catch (e) { window.scrollTo(0, to); }
  }

  function openShelf(want) {
    if (want === shelf) { want = null; }   // повторный тап закрывает
    if (shelf === 'archive' && want !== 'archive') { fold(arcBox, false); }
    if (shelf === 'bin' && want !== 'bin') { fold(binBox, false); }
    if (want === 'archive') { fold(arcBox, true, function () { reveal(arcBox); }); }
    if (want === 'bin') { fold(binBox, true, function () { reveal(binBox); }); }
    shelf = want;
    arcHead.classList.toggle('open', want === 'archive');
    binBtn.classList.toggle('on', want === 'bin');
  }

  arcHead.onclick = function () { openShelf('archive'); };
  binBtn.onclick = function () { openShelf('bin'); };

  /* --- перетаскивание ---
     Стандартный HTML5 drag&drop на телефоне не работает вообще,
     поэтому всё на pointer-событиях: они одинаковы для мыши и пальца. */

  var drag = null;

  document.addEventListener('pointerdown', function (e) {
    var grip = e.target.closest('.grip');
    if (!grip) { return; }
    e.preventDefault();

    var item = grip.closest('.item');
    var box = item.getBoundingClientRect();

    var ghost = item.cloneNode(true);
    ghost.className = 'item ghost';
    ghost.querySelector('.card').style.transform = '';   // тащим ровную карточку
    ghost.style.width = box.width + 'px';
    ghost.style.left = box.left + 'px';
    ghost.style.top = box.top + 'px';
    document.body.appendChild(ghost);

    var mark = document.createElement('div');
    mark.className = 'drop';
    mark.style.height = box.height + 'px';   // гнездо ровно в рост карточки

    // Порядок здесь важен. Сначала гнездо встаёт НА МЕСТО карточки и
    // только потом она уходит из потока: высота на этом месте не
    // меняется ни на кадр, и список остаётся стоять.
    // Раньше было наоборот — карточка пропадала, всё под ней прыгало
    // вверх, и позиция считалась уже по съехавшей разметке: дело
    // «просилось» на строку ниже, хотя палец ещё не двинулся.
    var host = item.parentNode;
    var mine = [].slice.call(host.querySelectorAll('.item')).indexOf(item);
    host.insertBefore(mark, item);
    item.style.display = 'none';

    drag = {
      id: item.dataset.id, item: item, ghost: ghost, mark: mark,
      // Цель известна с самого начала: место, откуда взяли. Отпустишь
      // не сдвинув — дело вернётся туда же.
      target: { host: host, list: host.id, index: mine },
      markIdx: mine,
      dx: e.clientX - box.left, dy: e.clientY - box.top,
      y: e.clientY      // где палец сейчас — по этому решаем, катить ли страницу
    };
    roller = requestAnimationFrame(roll);
    // Указателя может уже не быть (или событие не от живого пальца) —
    // захват тогда не нужен, движение всё равно ловится на document.
    try { grip.setPointerCapture(e.pointerId); } catch (err) { /* не беда */ }
  }, { passive: false });

  function rowsOf(host) {
    return [].slice.call(host.querySelectorAll('.item')).filter(function (r) {
      return r !== drag.item && r !== drag.ghost;
    });
  }

  // Считаем НОМЕР позиции, а не соседний элемент разметки.
  // Соседом может оказаться сама полоска-указатель — на этом всё и ломалось.
  function aim(y) {
    var best = null, bestDist = Infinity;
    LISTS.forEach(function (name) {
      var host = document.getElementById(name);
      var b = host.getBoundingClientRect();
      var d = y < b.top ? b.top - y : (y > b.bottom ? y - b.bottom : 0);
      if (d < bestDist) { bestDist = d; best = { host: host, list: name }; }
    });
    if (!best) { return; }

    var rows = rowsOf(best.host);
    var idx = rows.length;
    for (var i = 0; i < rows.length; i++) {
      var rb = rows[i].getBoundingClientRect();
      if (y < rb.top + rb.height / 2) { idx = i; break; }
    }
    best.index = idx;
    drag.target = best;

    // Гнездо переставляем ТОЛЬКО когда место правда сменилось: иначе
    // на каждое движение пальца список перекладывается заново и дрожит.
    if (drag.mark.parentNode !== best.host || drag.markIdx !== idx) {
      var was = snap();
      best.host.insertBefore(drag.mark, rows[idx] || null);
      drag.markIdx = idx;
      flip(was);          // соседи расступаются плавно, а не прыжком
    }
  }

  document.addEventListener('pointermove', function (e) {
    if (!drag) { return; }
    e.preventDefault();
    drag.y = e.clientY;
    drag.ghost.style.left = (e.clientX - drag.dx) + 'px';
    drag.ghost.style.top = (e.clientY - drag.dy) + 'px';
    aim(e.clientY);
  }, { passive: false });

  /* --- автопрокрутка на весу ---
     Разделов стало четыре, и дело из верхнего в нижний приходилось
     нести в несколько приёмов: опустил, проскроллил, взял заново.
     Теперь палец у края экрана сам катит страницу, а карточка
     остаётся в руке: ghost стоит position:fixed, под пальцем он и
     висит. Вернул палец к середине — прокрутка встала. */

  var EDGE = 110;      // высота чувствительной полосы у края, px
  var SLOW = 70;       // скорость на дальней границе полосы, px/сек
  var FAST = 430;      // скорость у самого края
  var roller = null;   // кадр анимации, пока катим

  /* Меряем по видимой области, а не по окну: с открытой клавиатурой
     это разные вещи (см. glide()). */
  function seen() {
    var vv = window.visualViewport;
    return vv ? { top: vv.offsetTop, height: vv.height }
      : { top: 0, height: window.innerHeight };
  }

  // Знак — направление, модуль — скорость. Ноль = палец не у края.
  function rollSpeed(y) {
    var v = seen();
    var edge = Math.min(EDGE, v.height * 0.22);
    var up = (v.top + edge) - y;                 // насколько зашли в верхнюю полосу
    var down = y - (v.top + v.height - edge);    // ...и в нижнюю
    var deep = Math.max(up, down);
    if (deep <= 0) { return 0; }
    var k = Math.min(1, deep / edge);
    // Квадрат, а не прямая: у границы полосы почти шагом — успеваешь
    // читать, — и разгон только у самого края.
    var speed = SLOW + (FAST - SLOW) * k * k;
    return up > down ? -speed : speed;
  }

  function roll(now) {
    if (!drag) { roller = null; return; }
    roller = requestAnimationFrame(roll);
    if (demo) { return; }
    // Первый кадр только запоминает время. И ограничиваем шаг: если
    // вкладка была свёрнута, между кадрами пройдут секунды.
    var dt = drag.rolled ? Math.min(now - drag.rolled, 50) / 1000 : 0;
    drag.rolled = now;
    var speed = rollSpeed(drag.y);
    if (!speed || !dt) { return; }

    var max = Math.max(0, document.documentElement.scrollHeight - window.innerHeight);
    var to = Math.max(0, Math.min(window.scrollY + speed * dt, max));
    if (Math.abs(to - window.scrollY) < 0.5) { return; }   // упёрлись в край страницы
    window.scrollTo(0, to);
    // Палец стоит, а содержимое едет — гнездо должно ехать вместе с ним.
    aim(drag.y);
  }

  function endDrag() {
    if (!drag) { return; }
    if (roller) { cancelAnimationFrame(roller); roller = null; }
    var d = drag, t = d.target;
    drag = null;   // сразу: палец отпущен, новый жест уже можно начинать

    // Гнездо всё ещё держит место — туда карточка и приземляется.
    var slot = d.mark.parentNode ? d.mark.getBoundingClientRect() : null;

    function land() {
      // Снимаем позиции, пока гнездо ещё держит место. Уберём его
      // раньше — список схлопнется, и перерисовка примет схлопнутое
      // состояние за исходное: все три раздела дружно подпрыгнут.
      var was = snap();
      d.ghost.remove();
      if (d.mark.parentNode) { d.mark.remove(); }
      if (t) {
        var f = find(d.id);
        if (f && (f.list !== t.list || f.idx !== t.index)) {
          doc[f.list].splice(f.idx, 1);
          // t.index уже посчитан БЕЗ перетаскиваемой карточки,
          // поэтому после удаления поправка не нужна.
          doc[t.list].splice(Math.min(t.index, doc[t.list].length), 0, f.task);
          queue();
        }
      }
      // Старую (спрятанную) карточку не возвращаем в поток: draw()
      // всё равно пересоберёт разметку с нуля.
      draw(was);
    }

    if (!slot) { land(); return; }
    d.ghost.classList.add('landing');
    d.ghost.style.transition =
      'left .19s cubic-bezier(.2,.8,.2,1), top .19s cubic-bezier(.2,.8,.2,1),' +
      ' transform .19s ease, box-shadow .19s ease';
    d.ghost.style.left = slot.left + 'px';
    d.ghost.style.top = slot.top + 'px';
    setTimeout(land, 200);
  }

  document.addEventListener('pointerup', endDrag);
  document.addEventListener('pointercancel', endDrag);

  /* --- смахивание влево: из-под карточки выезжает корзина --- */

  var SHIFT = 140;    // ширина обеих кнопок вместе с зазорами
  var swipe = null;   // текущее движение пальца
  var opened = null;  // карточка, которая сейчас показывает корзину

  function shut(item) {
    if (!item) { return; }
    var f = item.querySelector('.card');
    if (f) { f.style.transform = ''; }
    item.classList.remove('open');
    if (opened === item) { opened = null; }
  }

  // true — значит клик надо съесть: карточка была отодвинута,
  // палец просто закрывает её, а не открывает правку текста.
  function closeSwipe(item) {
    if (opened && opened === item) { shut(item); return true; }
    if (opened) { shut(opened); }
    return false;
  }

  document.addEventListener('pointerdown', function (e) {
    if (e.target.closest('.trash, .fav')) { return; }   // жмут кнопку — не мешаем
    var item = e.target.closest('.item');
    if (opened && opened !== item) { shut(opened); }
    if (!item || e.target.closest('.grip')) { return; }
    // Палец в открытом поле ввода — это установка курсора и выделение
    // текста. Никакого смахивания, иначе вместо курсора едет карточка.
    if (e.target.tagName === 'TEXTAREA') { return; }
    // Палец на кнопке — это нажатие, а не жест. Без этой проверки лёгкий
    // снос пальца в сторону при тапе по чекбоксу заводил смахивание,
    // и следующий за ним клик глушился — приходилось жать второй раз.
    if (e.target.closest('button')) { return; }
    if (!item.querySelector('.trash')) { return; }   // архив и «сделано» не смахиваются
    swipe = {
      item: item, card: item.querySelector('.card'),
      x: e.clientX, y: e.clientY, axis: null,
      // если карточка уже открыта — продолжаем с её нынешнего сдвига
      from: item.classList.contains('open') ? -SHIFT : 0,
      dx: item.classList.contains('open') ? -SHIFT : 0
    };
  });

  document.addEventListener('pointermove', function (e) {
    if (!swipe || drag) { return; }
    var dx = e.clientX - swipe.x, dy = e.clientY - swipe.y;
    if (!swipe.axis) {
      // Пока направление неясно — не мешаем странице скроллиться.
      if (Math.abs(dy) > 10 && Math.abs(dy) > Math.abs(dx)) { swipe = null; return; }
      if (Math.abs(dx) < 14) { return; }   // запас на дрожь пальца при тапе
      swipe.axis = 'x';
      swipe.item.classList.add('swiping');   // на время жеста — без анимации
    }
    swipe.dx = Math.max(-SHIFT, Math.min(0, swipe.from + dx));
    swipe.card.style.transform = 'translateX(' + swipe.dx + 'px)';
  });

  function endSwipe() {
    if (!swipe) { return; }
    var s = swipe;
    swipe = null;
    s.item.classList.remove('swiping');
    if (s.axis !== 'x') { return; }      // это был обычный тап
    // После жеста браузер добивает касание обычным кликом — он попадал
    // в текст карточки и тут же её закрывал. Глушим его, но ТОЛЬКО если
    // жест что-то изменил: иначе съедали бы и безобидные нажатия.
    // Порог маленький: годится и короткий жест, и длинный.
    if (s.dx <= -24) {
      afterButton(260);
      s.card.style.transform = 'translateX(-' + SHIFT + 'px)';
      s.item.classList.add('open');
      opened = s.item;
    } else {
      if (s.from !== 0) { afterButton(260); }   // закрывали открытую карточку
      shut(s.item);
    }
  }

  document.addEventListener('pointerup', endSwipe);
  document.addEventListener('pointercancel', endSwipe);

  /* --- старт --- */

  /* Заглушки вместо пустых списков на первую загрузку. Раньше страница
     сначала рисовала «пусто» во всех разделах, а через полсекунды —
     настоящие дела: высота менялась скачком, и всё подпрыгивало. */
  function skeleton() {
    var plan = { deadline: 3, free: 4, ideas: 3, done: 2 };
    Object.keys(plan).forEach(function (name) {
      var host = document.getElementById(name);
      var out = '';
      for (var i = 0; i < plan[name]; i++) {
        // Разная длина строк, чтобы это читалось как список дел,
        // а не как таблица одинаковых прямоугольников.
        var w = 42 + ((i * 37) % 46);
        out += '<div class="item skel"><div class="card"><div class="face">'
             + (name === 'done' ? '' : '<span class="sk sk-grip"></span>')
             + '<span class="sk sk-box"></span>'
             + '<span class="sk sk-line" style="width:' + w + '%"></span>'
             + '</div></div></div>';
      }
      host.innerHTML = out;
    });
  }

  /* --- первый приход: ключа нет, списка нет ------------------------- */

  function newKey() {
    // 32 байта случайности от криптографического источника, не Math.random:
    // ключ — это и есть весь доступ к списку.
    var b = new Uint8Array(32);
    window.crypto.getRandomValues(b);
    var out = '';
    for (var i = 0; i < b.length; i++) { out += ('0' + b[i].toString(16)).slice(-2); }
    return out;
  }

  function hello() {
    draw();   // за приветствием видно пустое приложение целиком
    var wrap = document.createElement('div');
    wrap.id = 'hello';
    wrap.innerHTML =
      '<div class="sheet"><div class="inner"><b>Список дел</b>' +
      '<p class="last">Три раздела, «сделано за сегодня», архив и корзина. ' +
      'Регистрации нет: список привязан к ключу, ключ хранится ' +
      'в этом браузере. Перенести его на другое устройство можно ' +
      'из меню в углу.</p>' +
      '<button class="go">Создать список</button></div></div>';
    document.body.appendChild(wrap);

    wrap.querySelector('.go').onclick = function () {
      key = newKey();
      try { localStorage.setItem(KEY, key); } catch (e) { /* приват — до перезагрузки */ }
      boot();   // список подтягивается, пока идёт прощание с приветствием

      var sheet = wrap.querySelector('.sheet');
      var inner = wrap.querySelector('.inner');
      sheet.style.height = sheet.offsetHeight + 'px';
      inner.classList.add('gone');

      setTimeout(function () {
        inner.innerHTML = '<b>Список создан</b>' +
          '<p class="last">Небольшая демонстрация →</p>';
        // Высота новой надписи известна только после вставки:
        // меряем её на невидимом тексте и ведём карточку к ней.
        sheet.style.height = (inner.offsetHeight + 34) + 'px';
        inner.classList.remove('gone');

        setTimeout(function () {
          wrap.className = 'out';
          setTimeout(function () { wrap.remove(); tour(); }, 400);
        }, 2000);
      }, 450);
    };
  }

  /* --- показ приёмов: всё делается на настоящем деле ------------------
     Не картинка и не видео: тур нажимает те же кнопки, что и палец,
     через настоящие события. Значит он не может разойтись с тем, как
     приложение работает на самом деле. */

  function tour(again) {
    var dim = document.createElement('div');
    dim.id = 'tour';
    var skip = document.createElement('button');
    skip.className = 'tourskip';
    skip.textContent = 'пропустить';
    document.body.appendChild(dim);
    document.body.appendChild(skip);

    var alive = true, id = null, timer = null, note = null;
    // made — дело, заведённое показом. id по ходу обнуляется, а это
    // держим до конца: по нему показ за собой и убирает.
    var made = null;
    // Название раздела показ меняет напоказ, но человек его уже мог
    // придумать сам — возвращаем как было.
    var nameWas = null;
    // Раздел, заведённый показом. По ходу он уезжает в корзину, но
    // прибрать его надо в любом случае — хоть на середине, хоть в конце.
    var madeSec = null;
    demo = true;    // пока идёт показ, поля ввода не забирают фокус

    /* Показ не должен оставлять следов — ни на середине, ни в конце.
       Прибираем и заведённое дело (где бы оно ни оказалось, хоть
       в корзине), и подменённое название раздела. */
    function undo() {
      var touched = false;
      if (made) {
        var f = find(made);
        if (f) { doc[f.list].splice(f.idx, 1); touched = true; }
        made = null;
      }
      if (nameWas !== null) {
        doc.names = doc.names || {};
        if (nameWas) { doc.names.deadline = nameWas; }
        else { delete doc.names.deadline; }
        nameWas = null;
        touched = true;
      }
      if (madeSec) {
        // Раздел мог остаться на странице (показ прервали) или уже
        // уехать в корзину — убираем и то, и другое.
        if ((doc.extra || []).indexOf(madeSec) >= 0) {
          doc.extra = doc.extra.filter(function (n) { return n !== madeSec; });
          delete doc[madeSec];
          touched = true;
        }
        for (var i = (doc.bin || []).length - 1; i >= 0; i--) {
          if (doc.bin[i].sec === madeSec) { doc.bin.splice(i, 1); touched = true; }
        }
        if (doc.names) { delete doc.names[madeSec]; }
        madeSec = null;
        relist();
      }
      if (touched) { queue(); draw(); renderTitles(); }
    }

    /* Прервать показ можно на любом шаге, поэтому прибираем всё, что он
       мог оставить, в том порядке, в каком оно накладывается друг на
       друга: сначала нарисованное поверх страницы, потом незаконченные
       жесты и открытые поля, и только в конце — сами данные. */
    function stop() {
      if (!alive) { return; }
      alive = false;
      demo = false;
      clearTimeout(timer);

      // Подсказка и кружки-«пальцы».
      if (note) { note.remove(); note = null; }
      [].forEach.call(document.querySelectorAll('.tapdot, .near'),
        function (n) { n.remove(); });

      // Перетаскивание бросили на середине: копия карточки висит поверх
      // страницы, а настоящая спрятана. Доводим жест до конца тем же
      // событием, каким его заканчивает палец.
      if (drag) {
        document.dispatchEvent(new PointerEvent('pointerup', { bubbles: true }));
      }

      // Открытые поля: правка дела, черновик, название раздела. У каждого
      // свой обработчик Escape — он и приберёт за собой как надо.
      [].forEach.call(document.querySelectorAll('.item textarea, .tt input'),
        function (f) {
          f.dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape', bubbles: true }));
        });

      var el = id && document.querySelector('.item[data-id="' + id + '"]');
      if (el) { shut(el); }        // смахнутая карточка закрывается
      if (menu) { shutMenu(); }
      if (ask) { shutAsk(); }
      undo();                      // дело, название раздела, сам раздел
      skip.remove();
      dim.className = 'out';
      setTimeout(function () { dim.remove(); }, 300);
    }
    skip.onclick = stop;

    function card() { return document.querySelector('.item[data-id="' + id + '"]'); }

    /* Часть списка может быть за краем экрана. Перед каждым шагом
       доводим страницу так, чтобы цель была видна и под ней осталось
       место для облачка. */
    function see(el) {
      if (!el) { return; }
      var b = el.getBoundingClientRect();
      if (b.top >= 66 && b.bottom <= window.innerHeight - 100) { return; }
      var to = window.scrollY + b.top - (window.innerHeight - b.height) / 2;
      to = Math.max(0, Math.min(to, document.body.scrollHeight - window.innerHeight));
      try { window.scrollTo({ top: to, behavior: 'smooth' }); }
      catch (e) { window.scrollTo(0, to); }
    }

    // Подпись встаёт под целью, а если та у нижнего края — над ней.
    // drop — сколько ещё опустить подпись, когда она встала снизу.
    // Нужен там, где после подписи что-то приезжает на её место.
    var GAP = 14;      // единый зазор между целью и подписью

    function near(el, text, side) {
      if (note) { note.remove(); note = null; }
      if (!el) { return; }
      see(el);
      var n = document.createElement('div');
      n.className = 'near';
      n.textContent = text;
      document.body.appendChild(n);
      note = n;
      var anchor = el;

      function place() {
        // Шаг мог смениться, пока мы ждали, — тогда это уже чужая подпись.
        if (note !== n) { return; }
        var el = anchor;
        if (!document.body.contains(el)) {
          // Список перерисовался, и узел, к которому мы привязались,
          // уже выброшен. Дело-то никуда не делось — находим его строку
          // заново по id и продолжаем как ни в чём не бывало.
          var item = el.closest && el.closest('.item');
          var back = item && item.dataset.id &&
            document.querySelector('.item[data-id="' + item.dataset.id + '"]');
          if (!back) { return; }
          el = anchor = back;
        }
        var box = el.getBoundingClientRect();
        // По вертикали отмеряем не от кнопки, а от того целого, частью
        // которого она является: от карточки дела — или от всей панели,
        // если цель лежит внутри меню либо окна вопроса. Иначе зазор
        // считался от кнопки, а глаз видит край панели в паре пикселей
        // ниже — и подпись выглядела приклеенной.
        var host = (el.closest &&
          (el.closest('#ask .askbox') || el.closest('#menu .sheet') ||
           el.closest('.item'))) || el;
        var vbox = host.getBoundingClientRect();
        var w = n.offsetWidth, h = n.offsetHeight;
        var left, top;

        if (side === 'right') {
          // Рядом с целью, а не под ней: под ней сейчас развернётся
          // панель, и подпись оказалась бы поверх её первой строки.
          left = box.right + 12;
          top = box.top + box.height / 2 - h / 2;
          if (left + w > window.innerWidth - 10) {
            left = Math.max(10, box.left - w - 12);
          }
        } else {
          left = box.left + box.width / 2 - w / 2;
          var below = vbox.bottom + GAP;
          top = below + h < window.innerHeight - 80
            ? below : Math.max(10, vbox.top - h - GAP);
        }
        left = Math.max(10, Math.min(left, window.innerWidth - w - 10));
        top = Math.max(10, Math.min(top, window.innerHeight - h - 10));

        // Открытая панель — меню или окно вопроса — это не фон, а то,
        // на что сейчас и смотрят. Подпись поверх неё закрывала как раз
        // ту строку, которую следующим шагом нажмут. Уводим за край.
        var panel = document.querySelector('#menu .sheet, #ask .askbox');
        if (panel) {
          var pb = panel.getBoundingClientRect();
          if (left < pb.right && left + w > pb.left &&
              top < pb.bottom && top + h > pb.top) {
            top = side === 'right'
              // Сбоку подпись стоит в полоске заголовка — её надо
              // приподнять над панелью, а не увозить под неё.
              ? Math.max(6, Math.min(top, pb.top - h - 6))
              : (pb.bottom + GAP + h < window.innerHeight
                ? pb.bottom + GAP
                : Math.max(10, pb.top - h - GAP));
          }
        }
        // Координаты страницы, а не экрана: облачко приклеено к цели и
        // не разъезжается с ней, пока страница доезжает до места.
        n.style.left = (left + window.scrollX) + 'px';
        n.style.top = (top + window.scrollY) + 'px';
      }

      /* Обстановка вокруг подписи: открыто ли меню, открыто ли окно
         вопроса, жив ли ещё узел, к которому мы привязаны. */
      function scene() {
        // Высота цели тоже в приметах: у черновика поле ввода
        // дорастает до своего размера уже после того, как подпись
        // встала, и зазор без пересчёта выходил меньше положенного.
        // Положение НЕ учитываем — оно меняется на каждом кадре
        // прокрутки, и подпись от этого дёргалась бы.
        return (document.querySelector('#menu .sheet') ? 'm' : '') +
          (document.querySelector('#ask .askbox') ? 'a' : '') +
          (document.body.contains(anchor)
            // Огрубляем до восьмушек: дробный пиксель после перерисовки
            // не повод трогать подпись, а выросшая строка текста — повод.
            ? 'e' : '');
      }

      var was = scene();
      place();
      // Два уточнения сразу вслед: у черновика поле ввода дорастает до
      // своего размера уже после вставки, и зазор без пересчёта выходил
      // меньше положенного. Оба попадают внутрь появления подписи
      // (riseIn идёт 0.3 с), поэтому глаз перестановки не видит.
      requestAnimationFrame(place);
      setTimeout(place, 80);
      // Меню и окно вопроса открываются СЛЕДУЮЩИМ шагом, через пару
      // секунд, — когда подпись уже стоит и обходить нечего. Значит,
      // ждать надо не времени, а СОБЫТИЯ. Переставляем только когда
      // обстановка изменилась: иначе подпись дёргалась на каждом тике,
      // подстраиваясь под ещё не доехавшую прокрутку.
      var watch = setInterval(function () {
        if (note !== n || !alive) { return clearInterval(watch); }
        var now = scene();
        if (now === was) { return; }
        was = now;
        place();
      }, 100);
      setTimeout(function () { clearInterval(watch); }, 3500);
    }

    // Круг вдвое больше цели. Верхнюю границу держим, иначе на карточке
    // во весь экран он превратился бы в заливку.
    function dot(el) {
      if (!el) { return; }
      see(el);
      var box = el.getBoundingClientRect();
      var size = Math.max(44, Math.min(Math.max(box.width, box.height) * 2, 130));
      var d = document.createElement('div');
      d.className = 'tapdot';
      d.style.width = size + 'px';
      d.style.height = size + 'px';
      d.style.left = (box.left + box.width / 2 - size / 2 + window.scrollX) + 'px';
      d.style.top = (box.top + box.height / 2 - size / 2 + window.scrollY) + 'px';
      document.body.appendChild(d);
      setTimeout(function () { d.remove(); }, 1050);
    }

    // Сначала круг, и только потом само нажатие: иначе разметка
    // меняется раньше, чем видно, куда нажали.
    function press(el, how) {
      if (!el) { return; }
      dot(el);
      setTimeout(function () {
        if (!alive) { return; }
        if (how === 'click') { el.click(); }
        else {
          el.dispatchEvent(new PointerEvent('pointerdown',
            { bubbles: true, cancelable: true }));
        }
      }, 320);
    }
    function tap(sel, how) {
      var el = card();
      press(el && el.querySelector(sel), how);
    }

    function typeInto(ta, text, done) {
      var i = 0;
      (function next() {
        if (!alive) { return; }
        if (i >= text.length) { return setTimeout(done, 900); }
        ta.value += text.charAt(i++);
        ta.dispatchEvent(new Event('input', { bubbles: true }));
        setTimeout(next, 82);
      }());
    }

    function type(text, done) {
      var ta = document.querySelector('#deadline textarea');
      return ta ? typeInto(ta, text, done) : done();
    }

    // Стереть хвост и дописать новый: так видно, что дело правится,
    // а не заводится заново.
    function retype(cut, add, done) {
      var el = card();
      var ta = el && el.querySelector('textarea');
      if (!ta) { return done(); }
      var n = 0;
      (function back() {
        if (!alive) { return; }
        if (n++ < cut) {
          ta.value = ta.value.slice(0, -1);
          ta.dispatchEvent(new Event('input', { bubbles: true }));
          return setTimeout(back, 110);
        }
        setTimeout(function () { typeInto(ta, add, done); }, 450);
      }());
    }

    /* Круг, который держится на экране весь жест и едет за «пальцем». */
    function hand(x, y, size) {
      size = size || 58;
      var sx = window.scrollX, sy = window.scrollY;
      var d = document.createElement('div');
      d.className = 'tapdot hold';
      d.style.width = size + 'px';
      d.style.height = size + 'px';
      document.body.appendChild(d);
      var self = {
        move: function (nx, ny) {
          d.style.left = (nx - size / 2 + sx) + 'px';
          d.style.top = (ny - size / 2 + sy) + 'px';
        },
        end: function () {
          d.classList.add('gone');
          setTimeout(function () { d.remove(); }, 320);
        }
      };
      self.move(x, y);
      return self;
    }

    /* Смахивание показываем жестом, а не подстановкой сдвига: приложение
       получает ту же цепочку событий, что и от пальца, и карточка
       открывается по своим правилам, а не по нашим. */
    function swipeOpen(done) {
      var el = card();
      var c = el && el.querySelector('.card');
      if (!c) { return done(); }
      var b = c.getBoundingClientRect();
      var x = b.right - 26, y = b.top + b.height / 2;
      var h = hand(x, y);
      setTimeout(function () {
        if (!alive) { return h.end(); }
        c.dispatchEvent(new PointerEvent('pointerdown',
          { bubbles: true, cancelable: true, clientX: x, clientY: y }));
        var n = 0, total = 18, dist = SHIFT + 14;
        (function move() {
          if (!alive) { return h.end(); }
          n++;
          var at = x - dist * (n / total);
          h.move(at, y);
          document.dispatchEvent(new PointerEvent('pointermove',
            { bubbles: true, cancelable: true, clientX: at, clientY: y }));
          if (n < total) { return setTimeout(move, 36); }
          setTimeout(function () {
            if (!alive) { return h.end(); }
            document.dispatchEvent(new PointerEvent('pointerup', { bubbles: true }));
            h.end();
            setTimeout(done, 500);
          }, 260);
        }());
      }, 350);
    }

    /* Перетаскивание руками не подделаешь одним событием: приложение
       ждёт всю цепочку pointerdown -> много pointermove -> pointerup,
       ровно как от пальца. Цель пересчитываем на каждом шаге —
       список под карточкой всё время перекладывается. */
    function dragTo(listName, done) {
      var el = card();
      var grip = el && el.querySelector('.grip');
      var host = document.getElementById(listName);
      if (!grip || !host) { return done(); }
      var gb = grip.getBoundingClientRect();
      var x = gb.left + gb.width / 2, y = gb.top + gb.height / 2;
      var h = hand(x, y);
      setTimeout(function () {
        if (!alive) { return h.end(); }
        grip.dispatchEvent(new PointerEvent('pointerdown',
          { bubbles: true, cancelable: true, clientX: x, clientY: y }));
        var n = 0, total = 20;
        (function move() {
          if (!alive) { return h.end(); }
          n++;
          var to = host.getBoundingClientRect().top + 6;
          var at = y + (to - y) * (n / total);
          h.move(x, at);
          document.dispatchEvent(new PointerEvent('pointermove',
            { bubbles: true, cancelable: true, clientX: x, clientY: at }));
          if (n < total) { return setTimeout(move, 45); }
          setTimeout(function () {
            if (!alive) { return h.end(); }
            document.dispatchEvent(new PointerEvent('pointerup', { bubbles: true }));
            h.end();
            setTimeout(done, 500);
          }, 400);
        }());
      }, 380);
    }

    function plus() { return document.querySelector('.plus[data-add="deadline"]'); }
    function pen() { return document.querySelector('.pen[data-ren="deadline"]'); }

    // Пункт меню ищем по подписи: порядок пунктов ещё будет меняться,
    // а «Добавить новый раздел» останется собой.
    function menuRow() {
      var rows = document.querySelectorAll('#menu .row');
      for (var i = 0; i < rows.length; i++) {
        if (rows[i].textContent.indexOf('Добавить новый раздел') >= 0) { return rows[i]; }
      }
      return null;
    }
    function secEl() {
      return madeSec && document.querySelector('section[data-sec="' + madeSec + '"]');
    }

    // Первое число — пауза перед шагом. В ней уже заложены полсекунды
    // на то, чтобы глаз успел заметить результат прошлого действия.
    var steps = [
      [1100, function () { near(plus(), 'Дело добавляется сюда'); dot(plus()); }],
      [1400, function () {
        plus().click();
        // Черновик встаёт в конец списка, поэтому ищем его по полю
        // ввода, а не по месту.
        var ta = document.querySelector('#deadline textarea');
        var el = ta && ta.closest('.item');
        id = el && el.dataset.id;
        made = id;
        near(el, 'Текст пишется прямо в списке');
      }],
      [1400, function (next) { type('Купить молоко', next); return true; }],
      [500, function () { tap('.ok'); }],

      /* правка дела */
      [1700, function () { near(card(), 'Нажмите на дело — текст можно поправить'); }],
      [1700, function () { tap('.txt', 'click'); }],
      [1300, function (next) { retype(6, 'хлеб', next); return true; }],
      [600, function () { tap('.ok'); }],

      /* перенос в другой раздел */
      [1700, function () {
        var el = card();
        near(el && el.querySelector('.grip'),
          'За полоску слева дело переносится в другой раздел');
      }],
      [1500, function (next) {
        // Дело переезжает в другой раздел — и подпись, оставшаяся на
        // старом месте, оказывалась то под ним, то прямо на нём.
        // Переставляем её заново, когда дело уже приземлилось.
        dragTo('free', function () {
          near(card(), 'За полоску слева дело переносится в другой раздел');
          next();
        });
        return true;
      }],

      /* смахивание, звезда, корзина */
      [1700, function () { near(card(), 'Смахните дело влево — под ним кнопки'); }],
      [2300, function (next) { swipeOpen(next); return true; }],
      [1500, function () {
        var el = card();
        near(el && el.querySelector('.fav'), 'Звезда выделяет важное');
      }],
      [1700, function () { tap('.fav'); }],
      [3100, function () { near(card(), 'Нажать ещё раз — выделение снимется'); }],
      [1700, function (next) { swipeOpen(next); return true; }],
      [1200, function () { tap('.fav'); }],
      [3100, function () { near(card(), 'А корзина удаляет дело'); }],
      [1700, function (next) { swipeOpen(next); return true; }],
      [1200, function () {
        var el = card();
        near(el && el.querySelector('.trash'), 'Дело уйдёт в корзину на семь дней');
      }],
      [2000, function () { tap('.trash'); id = null; }],

      /* название раздела */
      [2000, function () { near(pen(), 'Название раздела можно поменять'); dot(pen()); }],
      [1600, function () {
        nameWas = (doc.names && doc.names.deadline) || '';
        press(pen(), 'click');
      }],
      [1500, function (next) {
        var inp = document.querySelector('#t-deadline input');
        if (!inp) { next(); return true; }
        near(inp, 'Впишите своё название');
        inp.value = '';                     // старое имя было выделено целиком
        typeInto(inp, 'В отпуске', next);
        return true;
      }],
      [700, function () {
        press(pen().parentNode.querySelector('.okmini:not(.nomini)'));
      }],
      [1600, function () {
        near(document.getElementById('t-deadline'), 'Готово, раздел переименован');
      }],

      /* меню */
      [2200, function () {
        var b = document.getElementById('burger');
        // Не под кнопкой, а справа от заголовка: под кнопкой сейчас
        // развернётся меню, и подпись села бы на его первую строку —
        // ту самую, которую следующим шагом и нажмут.
        near(document.querySelector('header h1') || b, 'В углу — меню', 'right');
        dot(b);
      }],
      [1600, function () { press(document.getElementById('burger'), 'click'); }],
      [1900, function () {
        near(document.querySelector('#menu .sheet'), 'Здесь дополнительные опции');
      }],

      /* свой раздел: завести и убрать */
      [2600, function () {
        var r = menuRow();
        if (!r) { return; }
        near(r, 'Свой раздел заводится отсюда');
        dot(r);
      }],
      [1700, function () {
        var r = menuRow();
        if (r) { press(r, 'click'); }
        else { shutMenu(); }
      }],
      // Меню гаснет 220 мс, потом раздел встаёт на место и страница
      // доматывается к нему — ждём и то, и другое.
      [2100, function () {
        var own = doc.extra || [];
        madeSec = own.length ? own[own.length - 1] : null;
        var s = secEl();
        near(s && s.querySelector('.tt'),
          'Новый раздел. Имя меняется карандашом, дела добавляются плюсом');
      }],
      [2600, function () {
        var s = secEl();
        near(s && s.querySelector('.del'), 'А корзина убирает раздел целиком');
        dot(s && s.querySelector('.del'));
      }],
      [1700, function () {
        var s = secEl();
        press(s && s.querySelector('.del'), 'click');
      }],
      [1400, function () {
        near(document.querySelector('#ask .askbox'),
          'Пять секунд на подумать — кнопка загорится сама');
      }],
      // Отсчёт идёт пять секунд; ждём его целиком и ещё немного.
      [5600, function () {
        var y = document.querySelector('#ask .yes');
        if (y) { near(y, 'Теперь можно'); dot(y); }
      }],
      [1500, function () {
        var y = document.querySelector('#ask .yes');
        if (y && !y.disabled) { y.click(); } else { shutAsk(); }
      }],
      [1600, function () {
        near(document.getElementById('binBtn'),
          'Раздел уехал в корзину целиком — вернуть можно семь дней');
        dot(document.getElementById('binBtn'));
      }],

      [3000, function () { near(plus(), 'Готово. Теперь добавляйте свои дела'); }],
      [3500, stop]
    ];

    (function run(n) {
      if (!alive || n >= steps.length) { return; }
      timer = setTimeout(function () {
        if (!alive) { return; }
        var waits = steps[n][1](function () { run(n + 1); });
        if (!waits) { run(n + 1); }
      }, steps[n][0]);
    }(0));
  }

  function boot() {
    /* Сначала рисуем прошлое состояние из памяти браузера — оно почти
       всегда верное, и страница появляется мгновенно и на своих местах.
       Ответ сервера потом просто уточнит список, а FLIP сгладит разницу.
       Заглушки нужны только тем, кто открыл приложение впервые. */
    var cached = localStorage.getItem(CACHE);
    if (cached) {
      try {
        doc = JSON.parse(cached);
        relist();
        purge();
        draw();
      } catch (e) {
        skeleton();
      }
    } else {
      skeleton();
    }

    pull();
    // Вернулся к вкладке — подтянуть, вдруг правил с телефона.
    document.addEventListener('visibilitychange', function () {
      if (!document.hidden && !dirty) { pull(); }
    });
    setInterval(function () { if (!dirty && !document.hidden) { pull(); } }, 60000);

    // Отдельный сторож полуночи. Опрос сервера может не сработать —
    // нет связи, открыта правка, есть несохранённое, — а список должен
    // очиститься ровно в 00:00 в любом случае.
    var lastDay = midnight();
    setInterval(function () {
      var day = midnight();
      if (day === lastDay || busy()) { return; }
      lastDay = day;
      if (purge()) { queue(); }
      draw();
    }, 30000);
  }

  if (key) { boot(); } else { hello(); }
}());
</script>

<script>
/* Регистрация service worker. Без него Chrome считает страницу обычным
   сайтом и вешает на экран ярлык с буквой домена вместо иконки. */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('/sw.js').catch(function (e) {
      console.warn('sw:', e);   // не работает — приложение всё равно живёт
    });
  });
}
</script>
</body>
</html>
